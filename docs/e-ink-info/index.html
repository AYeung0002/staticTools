<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-inch E-ink Smart Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 模擬墨水屏的特質：極高對比、無平滑灰階漸層、粗體字為主 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 5px; /* 上下左右 5px 透明內退 */
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* 隱藏滾動條 */
        ::-webkit-scrollbar { display: none; }
        
        /* 增強墨水屏的黑白對比感 */
        .eink-black { background-color: #000; color: #fff; }
        .eink-border { border-color: #000; }
        .eink-text-gray { color: #777; } /* 加深灰色確保高對比 */
    </style>
</head>
<body>

    <!-- 滿版容器 (純內文網頁佈局) -->
    <div class="w-full h-full flex bg-white">
        
        <!-- ================= 左側：時間與日曆 (佔比約 48%) ================= -->
        <div class="w-[48%] flex flex-col pr-4 py-2 border-r-[3px] eink-border justify-between h-full">
            
            <!-- 時間與日期區域 -->
            <div class="text-center flex flex-col items-center">
                <!-- 極大化的時間 -->
                <div class="text-[9rem] font-black leading-[0.8] tracking-tighter tabular-nums -mt-2">19:42</div>
                <!-- 日期 -->
                <div class="text-[34px] font-black mt-4 tracking-tight">2026年11月1日 (日)</div>
                <!-- 農曆 -->
                <div class="mt-3 border eink-border rounded-md px-2 py-0.5 text-base font-bold inline-block eink-text-gray">
                    農曆九月廿三
                </div>
            </div>

            <!-- 日曆區域 -->
            <div class="flex-grow flex flex-col mt-4">
                <!-- 日曆標頭 -->
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center gap-2 font-black text-2xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        11 / 2026
                    </div>
                    <div class="flex gap-1">
                        <button class="border-2 eink-border rounded px-2 py-0.5 font-bold text-lg">◀</button>
                        <button class="border-2 eink-border rounded px-3 py-0.5 font-bold text-lg">今日</button>
                        <button class="border-2 eink-border rounded px-2 py-0.5 font-bold text-lg">▶</button>
                    </div>
                </div>

                <!-- 日曆網格 (放大字體至3xl，強制垂直居中填滿) -->
                <div class="grid grid-cols-7 grid-rows-6 text-center text-3xl font-black flex-grow items-center justify-items-center w-full">
                    <!-- 星期標頭 (稍微縮小以區分) -->
                    <div class="text-xl pb-1 border-b-2 eink-border text-gray-500 w-full">日</div>
                    <div class="text-xl pb-1 border-b-2 eink-border w-full">一</div>
                    <div class="text-xl pb-1 border-b-2 eink-border w-full">二</div>
                    <div class="text-xl pb-1 border-b-2 eink-border w-full">三</div>
                    <div class="text-xl pb-1 border-b-2 eink-border w-full">四</div>
                    <div class="text-xl pb-1 border-b-2 eink-border w-full">五</div>
                    <div class="text-xl pb-1 border-b-2 eink-border eink-text-gray w-full">六</div>

                    <!-- 日期 -->
                    <div class="w-10 h-10 eink-black rounded-full flex items-center justify-center">1</div>
                    <div class="flex flex-col items-center justify-center leading-none mt-2"><span>2</span><div class="w-2 h-2 rounded-full bg-gray-600 mt-1"></div></div>
                    <div>3</div>
                    <div>4</div>
                    <div>5</div>
                    <div>6</div>
                    <div class="eink-text-gray">7</div>

                    <div class="eink-text-gray">8</div><div>9</div><div>10</div><div>11</div><div>12</div><div>13</div><div class="eink-text-gray">14</div>
                    
                    <div class="eink-text-gray">15</div><div>16</div><div>17</div><div>18</div><div>19</div><div>20</div><div class="eink-text-gray">21</div>
                    
                    <div class="eink-text-gray">22</div><div>23</div><div>24</div><div>25</div><div>26</div><div>27</div><div class="eink-text-gray">28</div>
                    
                    <div class="eink-text-gray">29</div><div>30</div><div></div><div></div><div></div><div></div><div></div>
                </div>
            </div>
        </div>

        <!-- ================= 右側：天氣與預報 (佔比約 52%) ================= -->
        <div class="w-[52%] flex flex-col pl-4 py-2 justify-between bg-white h-full">
            
            <!-- 警告橫幅 (拆分兩行避免字體糊化) -->
            <div class="bg-black text-white rounded-xl px-4 py-2 flex items-center justify-center gap-4 w-full">
                <svg class="w-9 h-9 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <div class="font-bold text-xl leading-snug tracking-wide text-left">
                    火災危險警告為黃色，<br>表示火災危險性頗高。
                </div>
            </div>

            <!-- 當前天氣區域 (合併溫度，釋放垂直空間) -->
            <div class="flex justify-between items-start w-full mt-2">
                <!-- 左半部：大圖示 + 主溫度 + 最高低溫 (整合在一起) -->
                <div class="flex items-center gap-3">
                    <svg class="w-24 h-24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" fill="currentColor"></circle>
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                    <div class="flex flex-col justify-center">
                        <div class="text-[5.5rem] font-black leading-[0.85] tabular-nums tracking-tighter">28°</div>
                        <div class="text-2xl font-black mt-2 tabular-nums">31° / 26°</div>
                    </div>
                </div>

                <!-- 右半部：地點按鈕 + 敘述 -->
                <div class="flex flex-col items-end pt-1">
                    <div class="border-2 eink-border rounded-full px-3 py-1 flex items-center gap-1 text-lg font-bold bg-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        尖沙咀
                        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                    <!-- 兩行天氣敘述 -->
                    <div class="text-xl font-black text-right mt-3 leading-snug">
                        早晚部分時間多雲<br>日間大致天晴
                    </div>
                </div>
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-[3px] eink-black my-1"></div>

            <!-- 氣象細節：放大圖示與文字，均勻分佈 -->
            <div class="grid grid-cols-2 gap-x-4 gap-y-4 py-2 pl-2 pr-4">
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"></path></svg>
                    <span class="text-4xl font-black tabular-nums">72%</span>
                </div>
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span class="text-4xl font-black">2 <span class="text-2xl">(低)</span></span>
                </div>
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2"></path></svg>
                    <span class="text-4xl font-black text-nowrap">東風 <span class="text-3xl">3級</span></span>
                </div>
                <div class="flex items-center gap-3">
                    <!-- 雨雲圖示 -->
                    <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 19l-2 3m6-3l-2 3m6-3l-2 3"></path>
                    </svg>
                    <span class="text-4xl font-black">低</span>
                </div>
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-[3px] eink-black my-1"></div>

            <!-- 未來五天預報區域 -->
            <div class="flex flex-col mt-1">
                <!-- 標題與更新按鈕 -->
                <div class="flex justify-between items-end mb-2">
                    <div class="flex items-center gap-2 text-xl font-bold">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
                        未來五天 <span class="text-lg eink-text-gray font-bold">更新於 19:35</span>
                    </div>
                    <div class="border-2 eink-border rounded px-2 py-0.5 text-lg font-bold flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        15分
                    </div>
                </div>

                <!-- 五天卡片 (改為緊湊排列，去除內部多餘留白) -->
                <div class="grid grid-cols-5 gap-2 pb-1">
                    
                    <!-- 卡片 1 (今天/明天) -->
                    <div class="border-[3px] eink-border rounded-xl flex flex-col items-center justify-center gap-2 py-3 bg-gray-100">
                        <div class="text-2xl font-black leading-none mt-1 flex flex-col items-center gap-1.5">
                            <span>週一</span>
                            <div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>
                        </div>
                        <svg class="w-10 h-10 my-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                        <div class="flex flex-col items-center leading-none gap-1.5">
                            <span class="text-3xl font-black tabular-nums">31°</span>
                            <span class="text-xl font-bold eink-text-gray tabular-nums">26°</span>
                        </div>
                    </div>

                    <!-- 卡片 2 -->
                    <div class="border-[3px] eink-border rounded-xl flex flex-col items-center justify-center gap-2 py-3">
                        <div class="text-2xl font-black leading-none mt-1 flex flex-col items-center gap-1.5">
                            <span>週二</span>
                            <!-- 透明點用於對齊 -->
                            <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
                        </div>
                        <svg class="w-10 h-10 my-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                        <div class="flex flex-col items-center leading-none gap-1.5">
                            <span class="text-3xl font-black tabular-nums">29°</span>
                            <span class="text-xl font-bold eink-text-gray tabular-nums">25°</span>
                        </div>
                    </div>

                    <!-- 卡片 3 -->
                    <div class="border-[3px] eink-border rounded-xl flex flex-col items-center justify-center gap-2 py-3">
                        <div class="text-2xl font-black leading-none mt-1 flex flex-col items-center gap-1.5">
                            <span>週三</span>
                            <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
                        </div>
                        <svg class="w-10 h-10 my-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                        <div class="flex flex-col items-center leading-none gap-1.5">
                            <span class="text-3xl font-black tabular-nums">28°</span>
                            <span class="text-xl font-bold eink-text-gray tabular-nums">25°</span>
                        </div>
                    </div>

                    <!-- 卡片 4 -->
                    <div class="border-[3px] eink-border rounded-xl flex flex-col items-center justify-center gap-2 py-3">
                        <div class="text-2xl font-black leading-none mt-1 flex flex-col items-center gap-1.5">
                            <span>週四</span>
                            <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
                        </div>
                        <svg class="w-10 h-10 my-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                        <div class="flex flex-col items-center leading-none gap-1.5">
                            <span class="text-3xl font-black tabular-nums">30°</span>
                            <span class="text-xl font-bold eink-text-gray tabular-nums">26°</span>
                        </div>
                    </div>

                    <!-- 卡片 5 -->
                    <div class="border-[3px] eink-border rounded-xl flex flex-col items-center justify-center gap-2 py-3">
                        <div class="text-2xl font-black leading-none mt-1 flex flex-col items-center gap-1.5">
                            <span>週五</span>
                            <div class="w-1.5 h-1.5 rounded-full bg-transparent"></div>
                        </div>
                        <svg class="w-10 h-10 my-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                        <div class="flex flex-col items-center leading-none gap-1.5">
                            <span class="text-3xl font-black tabular-nums">29°</span>
                            <span class="text-xl font-bold eink-text-gray tabular-nums">26°</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</body>
</html>
