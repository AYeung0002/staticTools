<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-ink Smart Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 模擬墨水屏特質：極高對比、無平滑灰階漸層、粗體字為主 */
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 5px;
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* 隱藏滾動條 */
        ::-webkit-scrollbar { display: none; }
        
        /* 增強墨水屏黑白對比感 */
        .eink-black { background-color: #000; color: #fff; }
        .eink-border { border-color: #000; }
        .eink-text-gray { color: #777; }
        button:active { background-color: #000; color: #fff; }
        * { box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- 滿版容器 -->
    <div class="w-full h-full flex bg-white justify-between overflow-hidden">
        
        <!-- ================= 左側：時間與日曆 (佔比約 48%) ================= -->
        <div class="w-[48%] flex flex-col pr-4 py-2 border-r-[3px] eink-border justify-between h-full min-h-0">
            
            <!-- 時間與日期區域 -->
            <div class="text-center flex flex-col items-center flex-none">
                <!-- 極大化時間 -->
                <div id="time-display" class="text-[8.5rem] font-black leading-[0.8] tracking-tighter tabular-nums -mt-2 text-black">--:--</div>
                <!-- 日期 -->
                <div id="date-display" class="text-[32px] font-black mt-3.5 tracking-tight text-black">載入中...</div>
                <!-- 農曆 -->
                <div id="lunar-display" class="mt-2.5 border eink-border rounded-md px-2.5 py-0.5 text-base font-bold inline-block eink-text-gray bg-white">
                    --
                </div>
            </div>

            <!-- 日曆區域 -->
            <div class="flex-1 flex flex-col mt-3 min-h-0 justify-between">
                <!-- 日曆標頭 -->
                <div class="flex justify-between items-center mb-1.5 flex-none">
                    <div class="flex items-center gap-2 font-black text-2xl text-black">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span id="calendar-month-title">-- / ----</span>
                    </div>
                    <div class="flex gap-1 text-black">
                        <button id="prev-month" aria-label="上一個月" class="border-2 eink-border rounded px-2 py-0.5 font-bold text-lg active:bg-black active:text-white">◀</button>
                        <button id="reset-month" aria-label="返回本月" class="border-2 eink-border rounded px-3 py-0.5 font-bold text-lg active:bg-black active:text-white" title="回到本月">今日</button>
                        <button id="next-month" aria-label="下一個月" class="border-2 eink-border rounded px-2 py-0.5 font-bold text-lg active:bg-black active:text-white">▶</button>
                    </div>
                </div>

                <!-- 日曆表頭與網格 -->
                <div id="calendar-container" class="flex-1 flex flex-col justify-between min-h-0"></div>
            </div>
        </div>

        <!-- ================= 右側：天氣與預報 (佔比約 52%) ================= -->
        <div class="w-[52%] flex flex-col pl-4 py-2 justify-between bg-white h-full min-h-0">
            
            <!-- ① 警告橫幅 (拆分兩行避免字體糊化，有警告時顯示) -->
            <div id="warning-bar" class="bg-black text-white rounded-xl px-4 py-2 flex items-center justify-center gap-4 w-full flex-none hidden">
                <svg class="w-8 h-8 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <div id="warning-text" class="font-bold text-xl leading-snug tracking-wide text-left">
                    --
                </div>
            </div>

            <!-- ② 當前天氣區域 (右側全版預留給預報敘述，不顯示位置，高度嚴格受控防止溢出) -->
            <div class="flex justify-between items-center w-full mt-1 flex-none min-h-[105px] max-h-[110px]">
                <!-- 左半部：大圖示 + 主溫度 + 最高低溫 (整合在一起) -->
                <div class="flex items-center gap-3 flex-none">
                    <i id="main-icon" class="ph-fill ph-sun text-[5.8rem] text-black leading-none flex-none"></i>
                    <div class="flex flex-col justify-center">
                        <div id="temp-display" class="text-[5.5rem] font-black leading-[0.85] tabular-nums tracking-tighter text-black">--°</div>
                        <div id="temp-range" class="text-2xl font-black mt-2 tabular-nums text-black">--° / --°</div>
                    </div>
                </div>

                <!-- 右半部：純天氣敘述 (去除按鈕，垂直置中，最大高度防溢出保護) -->
                <div class="flex-1 flex flex-col justify-center items-end pl-4 max-h-[108px] overflow-hidden">
                    <div id="weather-desc" class="text-xl font-black text-right leading-snug text-black">
                        載入中...
                    </div>
                </div>
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-[3px] bg-black my-1 flex-none"></div>

            <!-- ③ 氣象細節：放大圖示與文字，均勻分佈 (2x2) -->
            <div class="grid grid-cols-2 gap-x-4 gap-y-3.5 py-1.5 pl-2 pr-4 flex-none">
                <!-- 濕度 -->
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9 flex-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"></path></svg>
                    <span id="humidity-display" class="text-4xl font-black tabular-nums">--%</span>
                </div>
                <!-- 紫外線 -->
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9 flex-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span id="uv-display" class="text-4xl font-black">--</span>
                </div>
                <!-- 風力 -->
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9 flex-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2"></path></svg>
                    <span id="wind-display" class="text-4xl font-black whitespace-nowrap">--</span>
                </div>
                <!-- 降雨機率 -->
                <div class="flex items-center gap-3">
                    <svg class="w-9 h-9 flex-none" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 19l-2 3m6-3l-2 3m6-3l-2 3"></path>
                    </svg>
                    <span id="psr-display" class="text-4xl font-black">--</span>
                </div>
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-[3px] bg-black my-1 flex-none"></div>

            <!-- ④ 未來五天預報區域 -->
            <div class="flex flex-col flex-1 min-h-0 justify-between mt-1">
                <!-- 標題與更新按鈕 -->
                <div class="flex justify-between items-end mb-1.5 flex-none">
                    <div class="flex items-center gap-2 text-xl font-bold text-black">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
                        未來五天 <span id="status-display" class="text-lg eink-text-gray font-bold">載入中...</span>
                    </div>
                    <button id="mode-btn" aria-label="切換更新頻率" class="border-2 eink-border rounded px-2.5 py-0.5 text-lg font-bold flex items-center gap-1 active:bg-black active:text-white" title="切換刷新頻率">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span id="mode-text">15分</span>
                    </button>
                </div>

                <!-- 五天卡片 (緊湊排列，去除內部多餘留白) -->
                <div id="forecast-row" class="grid grid-cols-5 gap-2 pb-0.5 flex-1 min-h-0"></div>
            </div>

        </div>
    </div>

    <script>
        let hkHolidays = {};
        const holidayPromises = {};
        let clockOffsetMs = 0;

        // 中央可信時間：本地時間加上伺服器偏移量
        function getNow() {
            return new Date(Date.now() + clockOffsetMs);
        }

        let displayedYear = getNow().getFullYear();
        let displayedMonth = getNow().getMonth();
        let lastKnownYear = getNow().getFullYear();
        let lastKnownMonth = getNow().getMonth();
        let lastKnownDate = getNow().getDate();
        let clockTimer = null;
        let weatherTimer = null;
        let isFastMode = false;
        let isFetchingWeather = false;
        let hasInitialWeatherLoaded = false;

        // 溫度數值解析工具（容許 0°C，非有限數值回退為 '--'）
        const toTemp = v => (Number.isFinite(Number(v)) ? Number(v) : '--');

        // 解析天文台發佈時間 (支援 ISO 8601 及中文日期字串)
        function parseHkoUpdateTime(str) {
            if (!str) return null;
            const iso = Date.parse(str);
            if (!isNaN(iso)) return iso;
            const m = String(str).match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s*(\d{1,2})時(\d{1,2})分/);
            if (m) {
                return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
            }
            return null;
        }

        // 格式化發佈時間為 HH:mm
        function formatUpdateTimeStr(timeMs, rawStr) {
            if (timeMs && !isNaN(timeMs)) {
                const d = new Date(timeMs);
                return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            }
            if (rawStr) {
                const m = String(rawStr).match(/(\d{1,2})[時:](\d{1,2})/);
                if (m) return `${m[1].padStart(2, '0')}:${m[2].padStart(2, '0')}`;
            }
            return formatTime(getNow());
        }

        // 校準伺服器時鐘偏移量（純依賴精確的 HTTP Date 標頭，偏差 > 3 秒才平滑對齊以防邊緣振盪）
        function syncServerClock(targetMs) {
            if (!targetMs || isNaN(targetMs)) return;
            const currentAdjusted = Date.now() + clockOffsetMs;
            const diff = targetMs - currentAdjusted;

            if (Math.abs(diff) > 3000) {
                clockOffsetMs += diff;
                alignClock();
            }
        }

        // 農曆格式化器單例快取（採用繁體中文防止簡體「闰」字，避免每分鐘重複實例化）
        let LUNAR_FMT = null;
        try {
            LUNAR_FMT = new Intl.DateTimeFormat('zh-Hant-u-ca-chinese', { month: 'long', day: 'numeric' });
        } catch (e) {
            try {
                LUNAR_FMT = new Intl.DateTimeFormat('zh-u-ca-chinese', { month: 'long', day: 'numeric' });
            } catch (err) {
                LUNAR_FMT = null;
            }
        }

        let cachedRhrData = null;

        /* ================= 輔助工具：安全多行文字插入 (限制最大行數，避免佈局溢出) ================= */
        function renderTextWithBreaks(targetEl, text, delimiters = /[。，；]/, maxSegments = 2) {
            targetEl.replaceChildren();
            let segments = String(text || '').replace(/[。！!.]+$/, '').split(delimiters).map(s => s.trim()).filter(Boolean);
            if (segments.length > maxSegments) {
                const head = segments.slice(0, maxSegments - 1);
                const tail = segments.slice(maxSegments - 1).join('，');
                segments = [...head, tail];
            }
            segments.forEach((seg, idx) => {
                targetEl.appendChild(document.createTextNode(seg));
                if (idx < segments.length - 1) {
                    targetEl.appendChild(document.createElement('br'));
                }
            });
        }

        /* ================= 通用帶逾時的 fetch (預設 10 秒，可選是否參與校時) ================= */
        async function fetchJSON(url, timeoutMs = 10000, syncClock = false) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                // 僅在指定時由 HTTP Date 標頭進行時鐘校準，避免並發請求重複觸發或互拉
                if (syncClock) {
                    const dateHeader = res.headers.get('date');
                    if (dateHeader) {
                        const httpMs = Date.parse(dateHeader);
                        if (!isNaN(httpMs)) {
                            syncServerClock(httpMs);
                        }
                    }
                }

                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        /* ================= 1. 香港公眾假期獲取 (具備 in-flight 去重，失敗不快取) ================= */
        async function fetchHolidays(year) {
            if (hkHolidays[year] !== undefined) return;
            if (holidayPromises[year]) return holidayPromises[year];

            holidayPromises[year] = (async () => {
                try {
                    const data = await fetchJSON(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`, 8000, false);
                    if (Array.isArray(data)) {
                        hkHolidays[year] = data.map(ev => ev.date.replace(/-/g, ''));
                    }
                } catch (e) {
                    console.warn(`假期讀取失敗 (${year}):`, e);
                } finally {
                    delete holidayPromises[year];
                }
            })();

            return holidayPromises[year];
        }

        /* ================= 2. 中文傳統農曆轉換 (兼顧不同 WebView/ICU 的數值與文字輸出) ================= */
        function getLunarText(d) {
            if (!LUNAR_FMT) return '';
            try {
                const parts = LUNAR_FMT.formatToParts(d);
                let mVal = '', dayVal = '';
                for (const p of parts) {
                    if (p.type === 'month') mVal = p.value;
                    if (p.type === 'day') dayVal = p.value;
                }
                if (mVal && dayVal) {
                    // 1. 處理月份：清洗 CLDR 內部代碼如 "M09", "M04L", "9"
                    const monthNames = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '臘'];
                    const isLeap = /L|閏|闰/i.test(mVal);
                    const mNumMatch = mVal.match(/\d+/);
                    let mStr = '';

                    if (mNumMatch) {
                        const mNum = parseInt(mNumMatch[0], 10);
                        if (mNum >= 1 && mNum <= 12) {
                            mStr = (isLeap ? '閏' : '') + monthNames[mNum - 1] + '月';
                        }
                    }

                    if (!mStr) {
                        mStr = mVal.replace(/[a-zA-Z]/g, '').trim();
                        if (!mStr.includes('月')) mStr += '月';
                    }

                    // 2. 處理日期：相容 "23", "廿三", "d23" 等格式
                    const dayNumMatch = dayVal.match(/\d+/);
                    let dayStr = dayVal.replace(/[a-zA-Z]/g, '').trim();
                    if (dayNumMatch) {
                        const num = parseInt(dayNumMatch[0], 10);
                        if (num >= 1 && num <= 30) {
                            if (num <= 10) dayStr = '初' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][num];
                            else if (num < 20) dayStr = '十' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'][num - 10];
                            else if (num === 20) dayStr = '二十';
                            else if (num < 30) dayStr = '廿' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'][num - 20];
                            else if (num === 30) dayStr = '三十';
                        }
                    }

                    return `農曆 ${mStr}${dayStr}`;
                }
                return `農曆 ${LUNAR_FMT.format(d)}`;
            } catch (e) {
                return '';
            }
        }

        /* ================= 3. 月曆生成 (補全每週首尾天數，確保每週完整 7 天) ================= */
        function renderCalendar() {
            const now = getNow();
            const year = displayedYear, month = displayedMonth;
            const today = now.getDate();
            document.getElementById('calendar-month-title').innerText =
                `${String(month + 1).padStart(2, '0')} / ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let headerHtml = `<div class="grid grid-cols-7 text-center pb-1 border-b-2 eink-border w-full flex-none">`;
            ['日','一','二','三','四','五','六'].forEach(d => {
                const isWeekend = d === '日' || d === '六';
                headerHtml += `<div class="text-xl font-black ${isWeekend ? 'eink-text-gray' : 'text-black'}">${d}</div>`;
            });
            headerHtml += `</div>`;

            let bodyHtml = `<div class="grid grid-cols-7 text-center text-3xl font-black flex-1 items-center justify-items-center w-full content-around">`;
            
            // 補齊月初前一月的末尾天數（採用 eink-text-gray 維持高對比，去除不穩定的 opacity）
            const prevMonthLastDate = new Date(year, month, 0).getDate();
            for (let i = firstDay - 1; i >= 0; i--) {
                const pDay = prevMonthLastDate - i;
                bodyHtml += `<div class="eink-text-gray font-bold">${pDay}</div>`;
            }

            const currentHolidays = hkHolidays[year] || [];
            const isViewingCurrentMonth = (year === now.getFullYear() && month === now.getMonth());
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}${String(month+1).padStart(2,'0')}${String(i).padStart(2,'0')}`;
                const dow = new Date(year, month, i).getDay();
                const isWeekend = dow === 0 || dow === 6;
                const isHoliday = currentHolidays.includes(dateStr);
                const isToday = isViewingCurrentMonth && (i === today);

                if (isToday) {
                    bodyHtml += `<div class="w-10 h-10 eink-black rounded-full flex items-center justify-center">${i}</div>`;
                } else if (isHoliday) {
                    bodyHtml += `<div class="flex flex-col items-center justify-center leading-none mt-1">
                        <span class="${isWeekend ? 'eink-text-gray' : 'text-black'}">${i}</span>
                        <div class="w-2 h-2 rounded-full bg-gray-600 mt-1"></div>
                    </div>`;
                } else {
                    bodyHtml += `<div class="${isWeekend ? 'eink-text-gray' : 'text-black'}">${i}</div>`;
                }
            }

            // 補齊月末下個月的最初天數，確保該週填滿 7 天
            const lastDayDow = new Date(year, month, daysInMonth).getDay();
            const trailingDays = 6 - lastDayDow;
            for (let i = 1; i <= trailingDays; i++) {
                bodyHtml += `<div class="eink-text-gray font-bold">${i}</div>`;
            }

            bodyHtml += `</div>`;
            document.getElementById('calendar-container').innerHTML = `${headerHtml}${bodyHtml}`;
        }

        /* ================= 4. 時鐘與日期同步 (包含跨日/跨月自動切換) ================= */
        function formatTime(d) {
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        function updateTimeUI() {
            const now = getNow();
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('date-display').innerText =
                `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;
            document.getElementById('lunar-display').innerText = getLunarText(now);
            document.getElementById('time-display').innerText = formatTime(now);

            // 跨日或跨月檢查：若使用者原本停留在當前月份，自動跟隨跳至新月份；若停留在其他月份則僅重繪高亮
            const curDate = now.getDate();
            const curMonth = now.getMonth();
            const curYear = now.getFullYear();
            if (curDate !== lastKnownDate || curMonth !== lastKnownMonth || curYear !== lastKnownYear) {
                const wasViewingCurrent = (displayedYear === lastKnownYear && displayedMonth === lastKnownMonth);
                lastKnownDate = curDate;
                lastKnownMonth = curMonth;
                lastKnownYear = curYear;
                if (wasViewingCurrent) {
                    displayedYear = curYear;
                    displayedMonth = curMonth;
                }
                fetchHolidays(displayedYear).then(renderCalendar);
            }
        }

        function alignClock() {
            if (clockTimer) clearTimeout(clockTimer);
            updateTimeUI();
            const now = getNow();
            const msToNextMinute = 60000 - (now.getSeconds()*1000 + now.getMilliseconds());
            clockTimer = setTimeout(alignClock, Math.max(500, msToNextMinute));
        }

        /* ================= 5. 香港天文台全圖標映射 ================= */
        function weatherIcon(rawCode) {
            const code = Array.isArray(rawCode) ? parseInt(rawCode[0], 10) : parseInt(rawCode, 10);
            if (isNaN(code)) return 'ph-sun';
            if (code >= 50 && code <= 52) return 'ph-sun';
            if (code === 53 || code === 54) return 'ph-cloud-sun';
            if (code === 60 || code === 61) return 'ph-cloud';
            if (code >= 62 && code <= 65) return 'ph-cloud-rain';
            if (code >= 70 && code <= 77) return (code <= 73) ? 'ph-sun' : 'ph-cloud-sun';
            if (code >= 80 && code <= 84) return 'ph-wind';
            if (code === 85 || code === 86) return 'ph-cloud-fog';
            if (code >= 90 && code <= 93) return 'ph-cloud-lightning';
            return 'ph-sun-dim';
        }

        /* ================= 6. 地點氣溫數據同步 (固定選用尖沙咀天文台總部) ================= */
        function updateStationTemperature() {
            if (!cachedRhrData) return;
            const tempData = cachedRhrData.temperature?.data || [];
            // 固定選用尖沙咀（香港天文台總部），若未取得則由九龍城或首站遞補
            const tstKeys = ['香港天文台', '九龍城'];
            let matched = null;
            for (const key of tstKeys) {
                matched = tempData.find(d => d.place && d.place.includes(key));
                if (matched) break;
            }
            if (!matched) matched = tempData[0];

            if (matched) {
                const v = parseFloat(matched.value);
                document.getElementById('temp-display').textContent = isNaN(v) ? '--°' : `${Math.round(v)}°`;
            }
        }

        /* ================= 7. 天氣主流程 (含併發保護與防閃爍靜默更新) ================= */
        async function fetchWeather(isManual = false) {
            if (isFetchingWeather) return;
            isFetchingWeather = true;

            const ts = Date.now();
            const rhrUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${ts}`;
            const fndUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_t=${ts}`;
            const statusEl = document.getElementById('status-display');

            try {
                // 僅首次載入或手動切換時提示「更新中…」，背景輪詢維持靜默防止墨水屏文字跳動
                if (!hasInitialWeatherLoaded || isManual) {
                    statusEl.textContent = '更新中…';
                }
                // rhr 負責校準時鐘，fnd 不參與校時，避免同次更新重複觸發重繪
                const [rhr, fnd] = await Promise.all([
                    fetchJSON(rhrUrl, 10000, true),
                    fetchJSON(fndUrl, 10000, false)
                ]);
                cachedRhrData = rhr;
                hasInitialWeatherLoaded = true;

                // 提取天文台官方資料發佈時間（僅供介面顯示，不作時鐘校準避免觀測滯後導致時鐘倒流）
                const serverTimeMs = parseHkoUpdateTime(rhr.updateTime);

                // ① 警告橫幅安全插入 (嚴格限制為最多 2 行，防止推擠版面)
                const warnings = Array.isArray(rhr.warningMessage)
                    ? rhr.warningMessage
                    : (rhr.warningMessage ? [rhr.warningMessage] : []);
                const warningText = warnings.map(w => String(w).trim()).filter(Boolean).join(' / ');
                const warnBar = document.getElementById('warning-bar');
                const warnTextEl = document.getElementById('warning-text');
                if (warningText) {
                    renderTextWithBreaks(warnTextEl, warningText, /[，。]/, 2);
                    warnBar.classList.remove('hidden');
                } else {
                    warnBar.classList.add('hidden');
                }

                // ② 即時氣溫
                updateStationTemperature();

                // ③ 相對濕度
                const humObj = rhr.humidity?.data?.[0];
                document.getElementById('humidity-display').textContent =
                    (humObj && humObj.value !== undefined) ? `${humObj.value}%` : '--%';

                // ④ 紫外線指數安全構建
                const uvContainer = document.getElementById('uv-display');
                uvContainer.replaceChildren();
                const uvObj = rhr.uvindex?.data?.[0];
                if (uvObj && uvObj.value !== undefined) {
                    uvContainer.appendChild(document.createTextNode(`${uvObj.value} `));
                    if (uvObj.desc) {
                        const span = document.createElement('span');
                        span.className = 'text-2xl';
                        span.textContent = `(${uvObj.desc})`;
                        uvContainer.appendChild(span);
                    }
                } else {
                    uvContainer.appendChild(document.createTextNode('0 '));
                    const span = document.createElement('span');
                    span.className = 'text-2xl';
                    span.textContent = '(低)';
                    uvContainer.appendChild(span);
                }

                // ⑤ 主圖標
                if (rhr.icon && rhr.icon.length > 0) {
                    document.getElementById('main-icon').className =
                        `ph-fill ${weatherIcon(rhr.icon[0])} text-[5.8rem] text-black leading-none flex-none`;
                }

                // ⑥ 九天天氣預報
                const fc = fnd.weatherForecast || [];
                const forecastContainer = document.getElementById('forecast-row');

                if (fc.length > 0) {
                    const today = fc[0];
                    
                    // 天氣敘述安全斷行 (無按鈕阻礙，最多支援 3 行，高度受控不推擠其他元件)
                    renderTextWithBreaks(document.getElementById('weather-desc'), today.forecastWeather || '--', /[。，；]/, 3);

                    // 今日最高 / 最低溫 (統一透過 toTemp 解析)
                    document.getElementById('temp-range').textContent =
                        `${toTemp(today.forecastMaxtemp?.value)}° / ${toTemp(today.forecastMintemp?.value)}°`;

                    // 風力簡述安全構建
                    const windContainer = document.getElementById('wind-display');
                    windContainer.replaceChildren();
                    if (today.forecastWind) {
                        const w = String(today.forecastWind).replace(/[。，]/g, '').trim();
                        const match = w.match(/^(.+?)([\d至]+級)$/);
                        if (match) {
                            let dir = match[1].replace(/風$/, '');
                            if (!dir.endsWith('風') && dir.length <= 3) dir += '風';
                            windContainer.appendChild(document.createTextNode(`${dir} `));
                            const span = document.createElement('span');
                            span.className = 'text-3xl';
                            span.textContent = match[2];
                            windContainer.appendChild(span);
                        } else {
                            windContainer.textContent = w;
                        }
                    } else {
                        windContainer.textContent = '--';
                    }
                    
                    // 降雨機率
                    document.getElementById('psr-display').textContent = today.PSR || '--';

                    // 五天預報卡片：以預報日期精準判斷今天高亮
                    const now = getNow();
                    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                    const days = fc.slice(0, 5).map(wf => {
                        const fd = wf.forecastDate || '';
                        const d = new Date(+fd.slice(0,4), +fd.slice(4,6)-1, +fd.slice(6,8));
                        const diff = Math.round((d - todayMid) / 86400000);
                        const weekDay = ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];

                        return {
                            weekDay,
                            isToday: diff === 0,
                            max: toTemp(wf.forecastMaxtemp?.value),
                            min: toTemp(wf.forecastMintemp?.value),
                            icon: weatherIcon(wf.forecastIcon)
                        };
                    });

                    // 完全以安全 DOM 方式構建卡片節點
                    forecastContainer.replaceChildren();

                    days.forEach(d => {
                        const card = document.createElement('div');
                        card.className = `border-[3px] eink-border rounded-xl flex flex-col items-center justify-center gap-2 py-3 ${d.isToday ? 'bg-gray-100' : 'bg-white'}`;

                        const titleWrap = document.createElement('div');
                        titleWrap.className = 'text-2xl font-black leading-none mt-1 flex flex-col items-center gap-1.5';
                        const weekSpan = document.createElement('span');
                        weekSpan.textContent = d.weekDay;
                        titleWrap.appendChild(weekSpan);

                        const dot = document.createElement('div');
                        dot.className = `w-1.5 h-1.5 rounded-full ${d.isToday ? 'bg-gray-600' : 'bg-transparent'}`;
                        titleWrap.appendChild(dot);
                        card.appendChild(titleWrap);

                        const icon = document.createElement('i');
                        icon.className = `ph-fill ${d.icon} text-4xl text-black my-1`;
                        card.appendChild(icon);

                        const tempWrap = document.createElement('div');
                        tempWrap.className = 'flex flex-col items-center leading-none gap-1.5';
                        const maxSpan = document.createElement('span');
                        maxSpan.className = 'text-3xl font-black tabular-nums';
                        maxSpan.textContent = `${d.max}°`;
                        const minSpan = document.createElement('span');
                        minSpan.className = 'text-xl font-bold eink-text-gray tabular-nums';
                        minSpan.textContent = `${d.min}°`;
                        tempWrap.appendChild(maxSpan);
                        tempWrap.appendChild(minSpan);
                        card.appendChild(tempWrap);

                        forecastContainer.appendChild(card);
                    });
                } else {
                    // 若 HKO 返回空預報陣列，安全重設面板防止殘留舊資料
                    document.getElementById('weather-desc').textContent = '--';
                    document.getElementById('temp-range').textContent = '--° / --°';
                    document.getElementById('wind-display').textContent = '--';
                    document.getElementById('psr-display').textContent = '--';
                    forecastContainer.replaceChildren();
                }

                // 顯示天文台官方觀測發布時間，語意精準且與實際資料完全吻合
                const displayTime = formatUpdateTimeStr(serverTimeMs, rhr.updateTime);
                statusEl.textContent = `更新於 ${displayTime}`;
            } catch (err) {
                console.error('天氣讀取失敗:', err);
                statusEl.textContent = '讀取失敗';
            } finally {
                isFetchingWeather = false;
            }
        }

        /* ================= 8. 輪詢頻率與事件監聽 ================= */
        function startWeatherTimer() {
            if (weatherTimer) clearInterval(weatherTimer);
            weatherTimer = setInterval(() => fetchWeather(false), isFastMode ? 5*60*1000 : 15*60*1000);
        }

        function toggleMode() {
            isFastMode = !isFastMode;
            const text = document.getElementById('mode-text');
            if (isFastMode) {
                text.textContent = '5分';
            } else {
                text.textContent = '15分';
            }
            fetchWeather(true);
            startWeatherTimer();
        }

        async function init() {
            document.getElementById('prev-month').addEventListener('click', async () => {
                displayedMonth--;
                if (displayedMonth < 0) { displayedMonth = 11; displayedYear--; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('next-month').addEventListener('click', async () => {
                displayedMonth++;
                if (displayedMonth > 11) { displayedMonth = 0; displayedYear++; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('reset-month').addEventListener('click', async () => {
                const now = getNow();
                displayedYear = now.getFullYear();
                displayedMonth = now.getMonth();
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('mode-btn').addEventListener('click', toggleMode);

            // 支援休眠喚醒與省電：分頁不可見時暫停計時器，恢復時立即校準時間與同步氣象
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (clockTimer) {
                        clearTimeout(clockTimer);
                        clockTimer = null;
                    }
                    if (weatherTimer) {
                        clearInterval(weatherTimer);
                        weatherTimer = null;
                    }
                } else {
                    alignClock();
                    startWeatherTimer();
                    fetchWeather(true);
                }
            });

            await fetchHolidays(displayedYear);
            alignClock();
            renderCalendar();
            await fetchWeather(true);
            startWeatherTimer();
        }

        window.onload = init;
    </script>
</body>
