<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-ink 天氣資訊屏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --eink-black: #000; --eink-white: #fff; }
        body {
            background: var(--eink-white); color: var(--eink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang HK",
                         "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            -webkit-font-smoothing: antialiased; margin: 0; padding: 0; overflow: hidden;
        }
        .eink-border-r { border-right: 2px solid #ccc; }
        .eink-divider { border-bottom: 2px solid #ccc; }
        ::-webkit-scrollbar { display: none; }
        button:active { opacity: 0.5; }
        .tabular { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="h-screen w-screen p-2 box-border flex gap-3">

    <!-- 左側：時間與月曆 -->
    <aside class="w-[55%] flex flex-col eink-border-r pr-3 h-full min-h-0">
        <div class="flex-none flex flex-col items-center justify-center pt-2 pb-4 eink-divider">
            <div id="time-display" class="text-[12rem] leading-none font-black tracking-tighter text-gray-800 tabular">--:--</div>
            <div id="date-display" class="text-3xl font-bold mt-2 text-gray-600">載入中...</div>
        </div>
        <div class="flex-1 flex flex-col pt-3 pb-1 justify-center min-h-0">
            <div class="flex items-center justify-between mb-3 px-4 text-2xl font-bold text-gray-800 flex-none">
                <div class="flex items-center gap-2">
                    <i class="ph-bold ph-calendar-blank"></i>
                    <span id="calendar-month-title">--</span>
                </div>
                <div class="flex items-center gap-6 text-gray-400">
                    <button id="prev-month"><i class="ph-bold ph-caret-left"></i></button>
                    <button id="reset-month" title="回到本月">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a96,96,0,1,1-96-96c21.6,0,41.9,7.1,58.3,19.3l-10-10a8,8,0,0,1,11.4-11.4l24,24a8,8,0,0,1,0,11.4l-24,24a8,8,0,0,1-11.4-11.4l10.3-10.3A80,80,0,1,0,208,128a8,8,0,0,1,16,0Z"></path></svg>
                    </button>
                    <button id="next-month"><i class="ph-bold ph-caret-right"></i></button>
                </div>
            </div>
            <div id="calendar-container" class="flex-1 min-h-0 w-full flex flex-col justify-center px-2"></div>
        </div>
    </aside>

    <!-- 右側：天氣聚焦 -->
    <main class="w-[45%] flex flex-col h-full min-h-0 pb-1">

        <!-- ① 警告條 -->
        <div id="warning-bar"
             class="flex-none h-9 mb-1 flex items-center justify-center px-2 rounded-md bg-black text-white text-base font-bold opacity-0 transition-opacity">
            <i class="ph-fill ph-warning-circle mr-2 text-xl"></i>
            <span id="warning-text" class="truncate">--</span>
        </div>

        <!-- ② 主天氣 -->
        <section class="flex-none flex items-center justify-center gap-4 py-2 eink-divider">
            <i id="main-icon" class="ph-fill ph-cloud text-[4.5rem] text-gray-800"></i>
            <div class="flex flex-col">
                <div id="temp-display" class="text-[5.5rem] leading-none font-black tracking-tighter text-gray-800 tabular">--°</div>
                <div id="weather-desc" class="text-lg font-bold text-gray-600 mt-1 line-clamp-2 max-w-[12rem]">載入中...</div>
            </div>
        </section>

        <!-- ③ 今日詳情 -->
        <section class="flex-none grid grid-cols-2 gap-x-4 gap-y-1 px-4 py-2 text-base font-bold eink-divider">
            <div class="flex items-center gap-2"><i class="ph-fill ph-drop text-gray-600 text-xl"></i><span id="humidity-display" class="tabular">--%</span></div>
            <div class="flex items-center gap-2"><i class="ph-fill ph-sun-horizon text-gray-600 text-xl"></i><span id="uv-display" class="tabular">--</span></div>
            <div class="flex items-center gap-2"><i class="ph-fill ph-wind text-gray-600 text-xl"></i><span id="wind-display" class="truncate">--</span></div>
            <div class="flex items-center gap-2"><i class="ph-fill ph-umbrella text-gray-600 text-xl"></i><span id="psr-display" class="tabular">--</span></div>
        </section>

        <!-- ④ 未來預報 -->
        <section class="flex-1 flex flex-col min-h-0 pt-1">
            <div class="flex-none flex items-center gap-1 text-sm font-bold text-gray-500 mb-1 px-2">
                <i class="ph-bold ph-chart-line-up"></i>
                <span>未來天氣預報</span>
                <span id="status-display" class="ml-2 text-gray-400 font-normal text-xs"></span>
                <button id="mode-btn" class="ml-auto flex items-center gap-1 text-xs px-2 py-0.5 rounded bg-gray-100 border border-gray-300 text-gray-600">
                    <i id="mode-icon" class="ph-fill ph-leaf"></i>
                    <span id="mode-text">15m</span>
                </button>
            </div>
            <div id="chart-container" class="flex-none px-2" style="height: 34%;"></div>
            <div id="forecast-row" class="flex-1 flex items-stretch justify-between px-1 min-h-0 gap-1"></div>
        </section>
    </main>

    <script>
        /* ================= 全局狀態 ================= */
        let hkHolidays = {};
        let displayedYear = new Date().getFullYear();
        let displayedMonth = new Date().getMonth();
        let clockTimer = null;
        let weatherTimer = null;
        let isFastMode = false;

        /* ================= 1. 公眾假期 ================= */
        async function fetchHolidays(year) {
            if (hkHolidays[year]) return;
            try {
                const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`);
                const data = await res.json();
                hkHolidays[year] = data.map(ev => ev.date.replace(/-/g, ''));
            } catch (e) {
                console.error(`假期讀取失敗 (${year}):`, e);
                hkHolidays[year] = [];
            }
        }

        /* ================= 2. 月曆 ================= */
        function renderCalendar() {
            const now = new Date();
            const year = displayedYear, month = displayedMonth;
            const today = now.getDate();
            document.getElementById('calendar-month-title').innerText =
                `${String(month + 1).padStart(2, '0')}-${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let html = `<div class="grid grid-cols-7 gap-y-0.5 text-center w-full px-2">`;
            ['日','一','二','三','四','五','六'].forEach(d => {
                const isWeekend = d === '日' || d === '六';
                html += `<div class="font-bold text-lg mb-1 ${isWeekend ? 'text-gray-400' : 'text-gray-600'}">${d}</div>`;
            });
            for (let i = 0; i < firstDay; i++) html += `<div></div>`;

            const currentHolidays = hkHolidays[year] || [];
            const isViewingCurrentMonth = (year === now.getFullYear() && month === now.getMonth());
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}${String(month+1).padStart(2,'0')}${String(i).padStart(2,'0')}`;
                const dow = new Date(year, month, i).getDay();
                const isWeekend = dow === 0 || dow === 6;
                const isHoliday = currentHolidays.includes(dateStr);
                const isToday = isViewingCurrentMonth && (i === today);

                let textClass = "text-[1.4rem] font-bold leading-none ";
                let circleClass = "flex items-center justify-center h-10 w-10 mx-auto rounded-full border-4 box-border ";
                if (isToday) {
                    circleClass += "border-black text-black ";
                } else {
                    circleClass += "border-transparent ";
                    textClass += (isWeekend || isHoliday) ? "text-gray-400 " : "text-black ";
                }
                const marker = isHoliday && !isToday
                    ? `<div class="w-1.5 h-1.5 bg-gray-400 rounded-full mt-1"></div>`
                    : `<div class="w-1.5 h-1.5 mt-1 opacity-0"></div>`;
                html += `<div class="flex flex-col items-center justify-start"><div class="${circleClass}"><span class="${textClass}">${i}</span></div>${marker}</div>`;
            }
            html += `</div>`;
            document.getElementById('calendar-container').innerHTML = html;
        }

        /* ================= 3. 時鐘 ================= */
        function formatTime(d) {
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }
        function updateTimeUI() {
            const now = new Date();
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('date-display').innerText =
                `${String(now.getDate()).padStart(2,'0')}-${String(now.getMonth()+1).padStart(2,'0')}-${now.getFullYear()} (${days[now.getDay()]})`;
            document.getElementById('time-display').innerText = formatTime(now);

            if (displayedYear === now.getFullYear() && displayedMonth === now.getMonth()) {
                const cur = document.querySelector('.border-black');
                if (!cur || cur.innerText !== String(now.getDate())) renderCalendar();
            }
        }
        function alignClock() {
            updateTimeUI();
            const now = new Date();
            const msToNextMinute = 60000 - (now.getSeconds()*1000 + now.getMilliseconds());
            clockTimer = setTimeout(alignClock, msToNextMinute);
        }

        /* ================= 4. 圖標映射 ================= */
        function weatherIcon(code) {
            const c = parseInt(code, 10);
            if (isNaN(c)) return 'ph-cloud';
            if ([50,51,52,70,71,72,73,74,75,76,77].includes(c)) return 'ph-sun';
            if ([53,54,60,61].includes(c)) return 'ph-cloud-sun';
            if ([62,63,64,65].includes(c)) return 'ph-cloud-rain';
            if ([80,81,82,83,84].includes(c)) return 'ph-wind';
            if ([85,86].includes(c)) return 'ph-cloud-fog';
            if ([87,88,89,90,91,92,93,94,95,96,97,98,99].includes(c)) return 'ph-cloud-lightning';
            return 'ph-cloud';
        }

        /* ================= 5. SVG 折線圖 ================= */
        function renderTempChart(days) {
            const n = days.length;
            if (n < 2) return '';
            const W = 100, H = 100, padTop = 18, padBottom = 12;
            const nums = days.flatMap(d => [Number(d.max), Number(d.min)]).filter(v => !isNaN(v));
            if (!nums.length) return '';
            const maxT = Math.max(...nums), minT = Math.min(...nums);
            const top = maxT + 2, bottom = minT - 2;
            const span = Math.max(1, top - bottom);

            const xFor = i => (W * i) / (n - 1);
            const yFor = t => padTop + (H - padTop - padBottom) * (1 - (t - bottom) / span);

            const maxPts = days.map((d,i) => `${xFor(i)},${yFor(Number(d.max))}`).join(' ');
            const minPts = days.map((d,i) => `${xFor(i)},${yFor(Number(d.min))}`).join(' ');
            const area = `M ${xFor(0)},${yFor(Number(days[0].max))} ` +
                days.map((d,i) => `L ${xFor(i)},${yFor(Number(d.max))}`).join(' ') + ' ' +
                days.map((d,i) => `L ${xFor(n-1-i)},${yFor(Number(days[n-1-i].min))}`).join(' ') + ' Z';

            return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="w-full h-full">
                <path d="${area}" fill="#e8e8e8"/>
                <polyline points="${maxPts}" fill="none" stroke="#000" stroke-width="2"
                    vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
                <polyline points="${minPts}" fill="none" stroke="#888" stroke-width="1.5"
                    vector-effect="non-scaling-stroke" stroke-dasharray="4,3" stroke-linejoin="round"/>
            </svg>`;
        }

        /* ================= 6. 天氣主流程 ================= */
        async function fetchWeather() {
            const ts = Date.now();
            const rhrUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${ts}`;
            const fndUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_t=${ts}`;
            const statusEl = document.getElementById('status-display');

            async function fetchJSON(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                try { return JSON.parse(text); }
                catch { throw new Error('回應不是 JSON，可能被攔截或返回錯誤頁'); }
            }

            try {
                statusEl.textContent = '更新中…';
                const [rhr, fnd] = await Promise.all([fetchJSON(rhrUrl), fetchJSON(fndUrl)]);

                /* ① 警告條：warningMessage 是陣列 */
                const warnings = Array.isArray(rhr.warningMessage)
                    ? rhr.warningMessage
                    : (rhr.warningMessage ? [rhr.warningMessage] : []);
                const warningText = warnings.map(w => String(w).trim()).filter(Boolean).join(' / ');
                const warnBar = document.getElementById('warning-bar');
                if (warningText) {
                    document.getElementById('warning-text').textContent = warningText;
                    warnBar.classList.remove('opacity-0');
                } else {
                    warnBar.classList.add('opacity-0');
                }

                /* ② 實時溫度 */
                const tempData = rhr.temperature?.data || [];
                const tempObj = tempData.find(d => d.place === '香港天文台') || tempData[0];
                if (tempObj) {
                    const v = parseFloat(tempObj.value);
                    document.getElementById('temp-display').textContent = isNaN(v) ? '--°' : `${Math.round(v)}°`;
                }

                /* ③ 濕度 */
                const humObj = rhr.humidity?.data?.[0];
                if (humObj && humObj.value !== undefined) {
                    document.getElementById('humidity-display').textContent = `${humObj.value}%`;
                }

                /* ④ UV：rhrread.uvindex 是 {data:[{place,value,desc}]} */
                const uvObj = rhr.uvindex?.data?.[0];
                if (uvObj) {
                    const uvVal = uvObj.value ?? '';
                    const uvDesc = uvObj.desc ?? '';
                    document.getElementById('uv-display').textContent = `${uvVal} ${uvDesc}`.trim() || '--';
                }

                /* ⑤ 預報 */
                const fc = fnd.weatherForecast || [];
                if (fc.length > 0) {
                    const today = fc[0];
                    document.getElementById('weather-desc').textContent = today.forecastWeather || '--';
                    document.getElementById('main-icon').className =
                        `ph-fill ${weatherIcon(today.forecastIcon)} text-[4.5rem] text-gray-800`;
                    if (today.forecastWind) {
                        document.getElementById('wind-display').textContent = today.forecastWind;
                    }
                    if (today.PSR) {
                        document.getElementById('psr-display').textContent = `雨 ${today.PSR}`;
                    }

                    const now = new Date();
                    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const days = fc.slice(0, 5).map(wf => {
                        const fd = wf.forecastDate || '';
                        const d = new Date(+fd.slice(0,4), +fd.slice(4,6)-1, +fd.slice(6,8));
                        const diff = Math.round((d - todayMid) / 86400000);
                        const label = diff === 0 ? '今' : diff === 1 ? '明'
                                    : ['日','一','二','三','四','五','六'][d.getDay()];
                        return {
                            label,
                            max: wf.forecastMaxtemp?.value ?? '--',
                            min: wf.forecastMintemp?.value ?? '--',
                            icon: weatherIcon(wf.forecastIcon)
                        };
                    });

                    document.getElementById('chart-container').innerHTML = renderTempChart(days);
                    document.getElementById('forecast-row').innerHTML = days.map(d => `
                        <div class="flex-1 flex flex-col items-center justify-center rounded border border-gray-200 py-1">
                            <div class="text-xs font-bold text-gray-500">${d.label}</div>
                            <i class="ph-fill ${d.icon} text-xl text-gray-800 my-0.5"></i>
                            <div class="text-sm font-black text-gray-800 tabular leading-none">${d.max}°</div>
                            <div class="text-xs font-bold text-gray-400 tabular leading-none mt-0.5">${d.min}°</div>
                        </div>
                    `).join('');
                }

                statusEl.textContent = `更新於 ${new Date().toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit'})}`;
            } catch (err) {
                console.error('天氣讀取失敗:', err);
                statusEl.textContent = '載入失敗';
                document.getElementById('weather-desc').textContent = '數據載入失敗，請用 HTTP 伺服器打開';
                document.getElementById('temp-display').textContent = '--°';
            }
        }

        /* ================= 7. 刷新控制 ================= */
        function startWeatherTimer() {
            if (weatherTimer) clearInterval(weatherTimer);
            weatherTimer = setInterval(fetchWeather, isFastMode ? 5*60*1000 : 15*60*1000);
        }
        function toggleMode() {
            isFastMode = !isFastMode;
            const icon = document.getElementById('mode-icon');
            const text = document.getElementById('mode-text');
            if (isFastMode) {
                icon.className = 'ph-fill ph-lightning text-gray-800';
                text.textContent = '5m';
            } else {
                icon.className = 'ph-fill ph-leaf text-gray-500';
                text.textContent = '15m';
            }
            fetchWeather();
            startWeatherTimer();
        }

        /* ================= 8. 初始化 ================= */
        async function init() {
            document.getElementById('prev-month').addEventListener('click', async () => {
                displayedMonth--;
                if (displayedMonth < 0) { displayedMonth = 11; displayedYear--; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('next-month').addEventListener('click', async () => {
                displayedMonth++;
                if (displayedMonth > 11) { displayedMonth = 0; displayedYear++; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('reset-month').addEventListener('click', async () => {
                const now = new Date();
                displayedYear = now.getFullYear();
                displayedMonth = now.getMonth();
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('mode-btn').addEventListener('click', toggleMode);

            await fetchHolidays(displayedYear);
            alignClock();
            renderCalendar();
            await fetchWeather();
            startWeatherTimer();
        }

        window.onload = init;
    </script>
</body>
</html>
