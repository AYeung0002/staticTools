<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-ink Smart Display</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 5px;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        ::-webkit-scrollbar { display: none; }
        .eink-black { background-color: #000000; color: #ffffff; }
        .eink-border { border-color: #000000; }
        .eink-text-gray { color: #555555; }
        button:active { background-color: #000000; color: #ffffff; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="w-full h-full flex bg-white justify-between overflow-hidden relative">

        <!-- ================= 左側：時間與日曆 ================= -->
        <div class="w-[48%] flex flex-col pr-4 py-2 border-r-[3px] eink-border justify-between h-full min-h-0">
            <div class="text-center flex flex-col items-center flex-none">
                <div id="time-display" class="text-[8.5rem] font-black leading-[0.8] tracking-tighter tabular-nums -mt-2 text-black">--:--</div>
                <div id="date-display" class="text-[32px] font-bold mt-3.5 tracking-tight text-black">載入中...</div>
                <div id="lunar-display" class="mt-2.5 border-2 eink-border rounded-md px-2.5 py-0.5 text-base font-bold inline-block text-black bg-white">--</div>
            </div>
            <div class="flex-1 flex flex-col mt-3 min-h-0 justify-between">
                <div class="flex justify-between items-center mb-1.5 flex-none">
                    <div class="flex items-center gap-2 font-bold text-2xl text-black">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span id="calendar-month-title">-- / ----</span>
                    </div>
                    <div class="flex gap-1 text-black">
                        <button type="button" id="prev-month" aria-label="上一個月" class="border-2 eink-border rounded px-2 py-0.5 font-bold text-lg active:bg-black active:text-white">◀</button>
                        <button type="button" id="reset-month" aria-label="返回本月" class="border-2 eink-border rounded px-3 py-0.5 font-bold text-lg active:bg-black active:text-white" title="回到本月">今日</button>
                        <button type="button" id="next-month" aria-label="下一個月" class="border-2 eink-border rounded px-2 py-0.5 font-bold text-lg active:bg-black active:text-white">▶</button>
                    </div>
                </div>
                <div id="calendar-container" class="flex-1 flex flex-col justify-between min-h-0"></div>
            </div>
        </div>

        <!-- ================= 右側：警告 + 天氣 + 兩行純圖標細節 + 緊湊預報 ================= -->
        <div class="w-[52%] flex flex-col pl-4 pr-3 py-2 bg-white h-full min-h-0 justify-between">

            <!-- ① 天氣警告信號區 (無生效警告時完全隱藏) -->
            <div id="alert-panel" class="flex-none w-full mb-1 flex flex-col gap-1.5 hidden">
                <div id="alert-badges-container" class="bg-black text-white rounded-xl px-3 py-2 flex flex-wrap justify-center items-center gap-x-3 gap-y-2 cursor-pointer active:bg-gray-800 hidden"></div>
                <div id="alert-details" class="border-[2.5px] eink-border rounded-xl px-3 py-1.5 bg-white flex items-start gap-2 cursor-pointer active:bg-black active:text-white group hidden">
                    <i class="ph-fill ph-warning-circle text-2xl text-black group-active:text-white leading-none mt-0.5 shrink-0"></i>
                    <div id="alert-details-text" class="text-[0.95rem] font-bold leading-snug line-clamp-2"></div>
                </div>
            </div>

            <!-- ② 當前天氣區域 -->
            <div class="flex justify-between items-center w-full my-0.5 flex-none min-h-[95px] max-h-[110px]">
                <div class="flex items-center gap-2 flex-none">
                    <i id="main-icon" class="ph-fill ph-sun text-[5rem] text-black leading-none flex-none"></i>
                    <div class="flex flex-col justify-center">
                        <div id="temp-display" class="text-[5rem] font-black leading-[0.85] tabular-nums tracking-tighter text-black">--°</div>
                        <div id="temp-range" class="text-2xl font-bold mt-1 tabular-nums text-black">--° / --°</div>
                    </div>
                </div>
                <div id="weather-desc-container" class="flex-1 flex flex-col justify-end pb-1.5 items-end pl-3 max-h-[100px] min-w-0 overflow-hidden cursor-pointer active:opacity-60">
                    <div id="weather-desc-text" class="text-[1.1rem] font-bold text-right leading-snug text-black line-clamp-3">載入中...</div>
                </div>
            </div>

            <div class="w-full h-[2.5px] bg-black my-0.5 flex-none"></div>

            <!-- ③ 氣象細節 (純圖標高對比設計) -->
            <div class="flex flex-col justify-center gap-2 px-1 py-1.5 flex-none bg-white">
                <!-- 第一行：濕度、紫外線(移除底線，點擊彈窗導讀)、降雨機率 -->
                <div class="flex items-center justify-between w-full px-1">
                    <div class="flex items-center gap-2">
                        <svg class="w-7 h-7 flex-none text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"></path></svg>
                        <span id="humidity-display" class="text-3xl font-black tabular-nums text-black">--%</span>
                    </div>

                    <!-- UV 點擊導讀區塊（無下劃線） -->
                    <div id="uv-container" class="flex items-center gap-2 cursor-pointer active:opacity-60" title="點擊查看紫外線指數導讀">
                        <svg class="w-7 h-7 flex-none text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <span id="uv-display" class="text-3xl font-black tabular-nums text-black">--</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <svg class="w-7 h-7 flex-none text-black" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 19l-2 3m6-3l-2 3m6-3l-2 3"></path>
                        </svg>
                        <span id="psr-display" class="text-3xl font-black text-black">--</span>
                    </div>
                </div>

                <!-- 第二行：風向風速、空氣質素 (AQHI) -->
                <div class="flex items-center justify-between w-full px-1 pt-1.5 border-t-2 border-dashed border-gray-400">
                    <div class="flex items-center gap-2.5">
                        <i class="ph-fill ph-wind text-3xl text-black leading-none flex-none"></i>
                        <span id="wind-display" class="text-2xl font-black tracking-tight text-black">--</span>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <i class="ph-fill ph-leaf text-3xl text-black leading-none flex-none"></i>
                        <span id="aqhi-display" class="text-2xl font-black tabular-nums text-black">--</span>
                    </div>
                </div>
            </div>

            <div class="w-full h-[2.5px] bg-black my-0.5 flex-none"></div>

            <!-- ④ 未來五天預報區域 -->
            <div class="flex flex-col flex-none min-h-0">
                <div class="flex justify-between items-end mb-1 flex-none">
                    <div class="flex items-center gap-1.5 text-lg font-bold text-black min-w-0 pr-2">
                        <svg class="w-5 h-5 flex-none" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
                        <span class="flex-none">未來五天</span>
                        <span id="status-display" class="text-sm font-bold text-black truncate">載入中...</span>
                    </div>
                    <!-- 立即刷新按鈕 (純局部刷新) -->
                    <button type="button" id="refresh-btn" aria-label="立即刷新數據" class="border-2 eink-border rounded px-2.5 py-0.5 text-base font-bold flex items-center gap-1 active:bg-black active:text-white flex-none" title="立即刷新數據">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span id="refresh-btn-text">刷新</span>
                    </button>
                </div>

                <!-- 未來展望橫幅 -->
                <div id="outlook-banner" class="border-[2.5px] eink-border rounded-xl px-3 py-1.5 mb-1.5 flex items-center gap-2.5 flex-none bg-white cursor-pointer active:bg-black active:text-white group">
                    <span class="text-base font-black bg-black text-white group-active:bg-white group-active:text-black px-2.5 py-1.5 rounded-lg shrink-0 leading-normal inline-flex items-center">展望</span>
                    <span id="outlook-text" class="text-lg font-bold leading-snug line-clamp-2 text-black group-active:text-white">載入中...</span>
                </div>

                <!-- 五天卡片區域 -->
                <div id="forecast-row" class="grid grid-cols-5 gap-1.5 h-[154px] flex-none"></div>
            </div>

        </div>

        <!-- ================= ⑤ 詳細資訊彈窗 (移除 pre-wrap，防止頂部空白) ================= -->
        <div id="info-modal" class="fixed inset-0 z-50 bg-black/75 hidden flex items-center justify-center p-4">
            <div class="bg-white border-[4px] eink-border rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl relative">
                <div class="flex justify-between items-center border-b-[3px] eink-border px-5 py-3 shrink-0">
                    <h2 id="modal-title" class="text-2xl font-black text-black">詳細資訊</h2>
                    <button type="button" id="close-modal" aria-label="關閉視窗" class="border-[2.5px] eink-border rounded-full p-1.5 active:bg-black active:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div id="modal-content" class="p-4 overflow-y-auto text-black"></div>
                <div class="p-3 border-t-[3px] eink-border shrink-0">
                    <button type="button" id="close-modal-bottom" class="w-full py-2 border-[3px] eink-border rounded-xl font-black text-xl bg-white active:bg-black active:text-white">關閉視窗</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let hkHolidays = {};
        const holidayPromises = {};
        let clockOffsetMs = 0;

        function getNow() { return new Date(Date.now() + clockOffsetMs); }

        let displayedYear = getNow().getFullYear();
        let displayedMonth = getNow().getMonth();
        let lastKnownYear = getNow().getFullYear();
        let lastKnownMonth = getNow().getMonth();
        let lastKnownDate = getNow().getDate();
        let clockTimer = null;
        let isFetchingWeather = false;
        let hasInitialWeatherLoaded = false;
        let lastWeatherSuccessTime = 0;
        const AUTO_REFRESH_INTERVAL_MS = 15 * 60 * 1000;

        const MAX_VISIBLE_BADGES = 3;
        let currentActiveWarnings = [];
        let currentAlertFullText = '';
        let currentWeatherFullText = '';
        let currentOutlookFullText = '';

        const toTemp = v => (Number.isFinite(Number(v)) ? Number(v) : '--');

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function parseHkoUpdateTime(str) {
            if (!str) return null;
            const iso = Date.parse(str);
            if (!isNaN(iso)) return iso;
            const m = String(str).match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s*(\d{1,2})時(\d{1,2})分/);
            if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
            return null;
        }

        function formatTimeHM(timeMs) {
            const d = timeMs ? new Date(timeMs) : getNow();
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        function syncServerClock(targetMs) {
            if (!targetMs || isNaN(targetMs)) return;
            const currentAdjusted = Date.now() + clockOffsetMs;
            const diff = targetMs - currentAdjusted;
            if (Math.abs(diff) > 3000) {
                clockOffsetMs += diff;
                alignClock();
            }
        }

        let LUNAR_FMT = null;
        try {
            LUNAR_FMT = new Intl.DateTimeFormat('zh-Hant-u-ca-chinese', { month: 'long', day: 'numeric' });
        } catch (e) {
            try {
                LUNAR_FMT = new Intl.DateTimeFormat('zh-u-ca-chinese', { month: 'long', day: 'numeric' });
            } catch (err) {
                LUNAR_FMT = null;
            }
        }

        let cachedRhrData = null;

        /* ================= 彈窗控制 ================= */
        const modal = document.getElementById('info-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');

        function openModal(title, contentHtml) {
            modalTitle.textContent = title;
            modalContent.innerHTML = contentHtml;
            modal.classList.remove('hidden');
        }
        function closeModal() {
            modal.classList.add('hidden');
        }

        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('close-modal-bottom').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        document.getElementById('alert-badges-container').addEventListener('click', () => {
            if (currentActiveWarnings.length === 0) return;
            let listHtml = '<div class="grid grid-cols-2 gap-3 sm:gap-4">';
            currentActiveWarnings.forEach(w => {
                const isSevere = w.id.startsWith('TC') || w.id.includes('TC') || w.id === 'RAINB' || w.id.includes('RAINB');
                const badgeIcon = w.svg.replace('w-5 h-5', 'w-7 h-7').replace('text-lg', 'text-2xl');
                listHtml += `
                    <div class="flex items-center gap-2.5 p-3 rounded-xl border-[3px] ${isSevere ? 'bg-black text-white border-black' : 'bg-white border-black text-black'}">
                        ${badgeIcon}
                        <span class="text-lg sm:text-xl font-black leading-tight">${escapeHTML(w.name)}</span>
                    </div>`;
            });
            listHtml += '</div>';
            listHtml += '<div class="mt-4 pt-3 border-t-2 border-dashed border-gray-400 text-base font-bold text-gray-800 leading-relaxed text-center">以上為目前生效的天氣警告</div>';
            openModal(`生效警告 (${currentActiveWarnings.length})`, listHtml);
        });

        document.getElementById('alert-details').addEventListener('click', () => {
            if (!currentAlertFullText) return;
            openModal('警告詳細內容', `<div class="whitespace-pre-wrap text-xl font-bold leading-relaxed">${escapeHTML(currentAlertFullText)}</div>`);
        });

        document.getElementById('weather-desc-container').addEventListener('click', () => {
            if (!currentWeatherFullText) return;
            openModal('今日天氣預報', `<div class="whitespace-pre-wrap text-xl font-bold leading-relaxed">${escapeHTML(currentWeatherFullText)}</div>`);
        });

        document.getElementById('outlook-banner').addEventListener('click', () => {
            if (!currentOutlookFullText) return;
            openModal('未來天氣展望', `<div class="whitespace-pre-wrap text-xl font-bold leading-relaxed">${escapeHTML(currentOutlookFullText)}</div>`);
        });

        // 緊湊無頂部空白的紫外線指南 HTML
        const UV_GUIDE_HTML = `<div class="flex flex-col gap-2">
            <div class="border-[2.5px] border-black rounded-xl p-2.5 flex items-center justify-between bg-white">
                <div class="flex items-center gap-2">
                    <span class="bg-black text-white text-base font-black px-2 py-0.5 rounded leading-none">0 - 2</span>
                    <span class="text-lg font-black">低 (Low)</span>
                </div>
                <span class="text-sm font-bold text-gray-800">適宜戶外活動，正常情況無需特別防護</span>
            </div>
            <div class="border-[2.5px] border-black rounded-xl p-2.5 flex items-center justify-between bg-white">
                <div class="flex items-center gap-2">
                    <span class="bg-black text-white text-base font-black px-2 py-0.5 rounded leading-none">3 - 5</span>
                    <span class="text-lg font-black">中等 (Moderate)</span>
                </div>
                <span class="text-sm font-bold text-gray-800">戴遮陽帽、太陽眼鏡或塗抹防曬乳</span>
            </div>
            <div class="border-[2.5px] border-black rounded-xl p-2.5 flex items-center justify-between bg-gray-100">
                <div class="flex items-center gap-2">
                    <span class="bg-black text-white text-base font-black px-2 py-0.5 rounded leading-none">6 - 7</span>
                    <span class="text-lg font-black">高 (High)</span>
                </div>
                <span class="text-sm font-bold text-black">皮膚易曬傷，避免暴曬，宜打傘遮陽</span>
            </div>
            <div class="border-[2.5px] border-black rounded-xl p-2.5 flex items-center justify-between bg-gray-200">
                <div class="flex items-center gap-2">
                    <span class="bg-black text-white text-base font-black px-2 py-0.5 rounded leading-none">8 - 10</span>
                    <span class="text-lg font-black">甚高 (Very High)</span>
                </div>
                <span class="text-sm font-bold text-black">盡量留室內，戶外穿長袖防護衣物</span>
            </div>
            <div class="border-[2.5px] border-black rounded-xl p-2.5 flex items-center justify-between bg-black text-white">
                <div class="flex items-center gap-2">
                    <span class="bg-white text-black text-base font-black px-2 py-0.5 rounded leading-none">11+</span>
                    <span class="text-lg font-black">極高 (Extreme)</span>
                </div>
                <span class="text-sm font-bold text-gray-200">避免外出，數分鐘內皮膚可受損</span>
            </div>
            <div class="mt-2 pt-2 border-t-2 border-dashed border-gray-400 text-xs font-bold text-gray-600 text-center">
                標準來源：香港天文台與世界衛生組織 (WHO)
            </div>
        </div>`;

        document.getElementById('uv-container').addEventListener('click', () => {
            const curUv = document.getElementById('uv-display').textContent.trim();
            openModal(`紫外線指數導讀 (目前: ${curUv})`, UV_GUIDE_HTML);
        });

        async function fetchJSON(url, timeoutMs = 8000, syncClock = false) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                if (syncClock) {
                    const dateHeader = res.headers.get('date');
                    if (dateHeader) {
                        const httpMs = Date.parse(dateHeader);
                        if (!isNaN(httpMs)) syncServerClock(httpMs);
                    }
                }
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchViaProxy(targetUrl, timeoutMs = 4000, asText = false) {
            const encoded = encodeURIComponent(targetUrl);
            const proxies = [
                `https://api.allorigins.win/raw?url=${encoded}`,
                `https://api.codetabs.com/v1/proxy?quest=${encoded}`
            ];

            for (const proxyUrl of proxies) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const res = await fetch(proxyUrl, { signal: controller.signal });
                    if (!res.ok) continue;
                    return asText ? await res.text() : await res.json();
                } catch (e) {
                } finally {
                    clearTimeout(timer);
                }
            }
            return null;
        }

        async function fetchHolidays(year) {
            if (hkHolidays[year] !== undefined) return;
            if (holidayPromises[year]) return holidayPromises[year];
            holidayPromises[year] = (async () => {
                try {
                    const data = await fetchJSON(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`, 5000, false);
                    if (Array.isArray(data)) hkHolidays[year] = data.map(ev => ev.date.replace(/-/g, ''));
                } catch (e) {
                    console.warn(`假期讀取失敗 (${year}):`, e);
                } finally {
                    delete holidayPromises[year];
                }
            })();
            return holidayPromises[year];
        }

        function getLunarText(d) {
            if (!LUNAR_FMT) return '';
            try {
                const parts = LUNAR_FMT.formatToParts(d);
                let mVal = '', dayVal = '';
                for (const p of parts) {
                    if (p.type === 'month') mVal = p.value;
                    if (p.type === 'day') dayVal = p.value;
                }
                if (mVal && dayVal) {
                    const monthNames = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '臘'];
                    const isLeap = /L|閏|闰/i.test(mVal);
                    const mNumMatch = mVal.match(/\d+/);
                    let mStr = '';
                    if (mNumMatch) {
                        const mNum = parseInt(mNumMatch[0], 10);
                        if (mNum >= 1 && mNum <= 12) mStr = (isLeap ? '閏' : '') + monthNames[mNum - 1] + '月';
                    }
                    if (!mStr) {
                        mStr = mVal.replace(/[a-zA-Z]/g, '').trim();
                        if (!mStr.includes('月')) mStr += '月';
                    }
                    const dayNumMatch = dayVal.match(/\d+/);
                    let dayStr = dayVal.replace(/[a-zA-Z]/g, '').trim();
                    if (dayNumMatch) {
                        const num = parseInt(dayNumMatch[0], 10);
                        if (num >= 1 && num <= 30) {
                            if (num <= 10) dayStr = '初' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][num];
                            else if (num < 20) dayStr = '十' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'][num - 10];
                            else if (num === 20) dayStr = '二十';
                            else if (num < 30) dayStr = '廿' + ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'][num - 20];
                            else if (num === 30) dayStr = '三十';
                        }
                    }
                    return `農曆 ${mStr}${dayStr}`;
                }
                return `農曆 ${LUNAR_FMT.format(d)}`;
            } catch (e) {
                return '';
            }

function parseAQHI(data) {
    if (!data) return null;

    // 兼容多種可能的 JSON 結構
    let list = [];
    if (Array.isArray(data)) {
        list = data;
    } else if (Array.isArray(data.records)) {
        list = data.records;
    } else if (Array.isArray(data.data)) {
        list = data.data;
    } else if (typeof data === 'object') {
        list = Object.values(data).filter(v => v && typeof v === 'object');
    }

    if (list.length === 0) return null;

    // 優先選擇用戶關心地區的監測站，找不到則取第一筆
    const priorityKeys = ['深水埗', 'Sham Shui Po', 'SSP', '旺角', 'Mong Kok', 'MK', '九龍城', 'Kowloon City', 'KC', '觀塘', 'Kwun Tong', 'KT'];
    let matched = null;
    for (const key of priorityKeys) {
        matched = list.find(item => JSON.stringify(item).includes(key));
        if (matched) break;
    }
    if (!matched) matched = list[0];

    const val = matched.aqhi ?? matched.AQHI ?? matched.value ?? matched.aqhi_value ?? matched.index;
    const rawRisk = matched.health_risk || matched.health_risk_tc || matched.risk || matched.risk_tc || '';

    if (val === undefined || val === null || isNaN(parseInt(val, 10))) return null;

    const numVal = parseInt(val, 10);
    const riskStr = normalizeRisk(rawRisk, numVal);

    return { val: String(numVal), risk: riskStr };
}

/**
 * 將 AQHI 原始風險字串（中英文皆可）統一轉為中文等級
 * 對應香港 AQHI 五個等級：低 / 中 / 高 / 甚高 / 嚴重
 */
function normalizeRisk(rawRisk, numVal) {
    const str = String(rawRisk || '').trim();

    // 如果原本已是中文，直接根據關鍵字判斷
    if (/[低中高嚴]/.test(str)) {
        if (str.includes('嚴重') || str.includes('嚴')) return '嚴重';
        if (str.includes('甚高') || str.includes('非常高')) return '甚高';
        if (str.includes('低')) return '低';
        if (str.includes('中')) return '中';
        if (str.includes('高')) return '高';
    }

    // 英文對照表
    const enMap = {
        'low': '低',
        'moderate': '中',
        'high': '高',
        'very high': '甚高',
        'veryhigh': '甚高',
        'serious': '嚴重',
        'severe': '嚴重'
    };
    const lower = str.toLowerCase().replace(/\s+/g, ' ');
    for (const [en, zh] of Object.entries(enMap)) {
        if (lower === en || lower.includes(en)) return zh;
    }

    // 最後按 AQHI 數值推算（環保署官方分級）
    if (numVal <= 3) return '低';
    if (numVal <= 6) return '中';
    if (numVal === 7) return '高';
    if (numVal <= 10) return '甚高';
    return '嚴重';
}

                    psrSpan.textContent = `雨:${d.psr}`;
                    card.appendChild(psrSpan);
                    
                    forecastContainer.appendChild(card);
                });
            }

            const hkoUpdateTime = formatTimeHM(serverTimeMs);
            const clientRefreshTime = formatTimeHM(Date.now());
            document.getElementById('status-display').textContent = `更新於 ${hkoUpdateTime} (${clientRefreshTime})`;
        }
// ═══════════════════════════════════════════════════════════════
//  AQHI 空氣質素健康指數：改用 dashboard.data.gov.hk JSON API
//  端點：https://dashboard.data.gov.hk/api/aqhi-individual?format=json
//  回傳：[{station, aqhi, health_risk, publish_date}, ...]
// ═══════════════════════════════════════════════════════════════

async function fetchAuxiliaryData(ts) {
    const aqhiUrl = `https://dashboard.data.gov.hk/api/aqhi-individual?format=json&_t=${ts}`;
    let data = null;

    // 第一步：直接 fetch（dashboard.data.gov.hk 允許 CORS，通常可直接存取）
    try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(aqhiUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timer);
        if (res.ok) {
            data = await res.json();
        }
    } catch (e) {
        console.warn('AQHI 直接 fetch 失敗，改用代理:', e);
    }

    // 第二步：備援，透過 CORS 代理
    if (!data) {
        data = await fetchViaProxy(aqhiUrl, 5000, false);
    }

    // 第三步：解析並更新 UI
    const aqhiResult = parseAQHI(data);
    const display = document.getElementById('aqhi-display');
    if (!display) return;

    if (aqhiResult) {
        // 顯示格式：「數值 + 等級」（等級用較小字體區分）
        display.innerHTML = `${escapeHTML(aqhiResult.val)} <span class="text-xl font-bold">${escapeHTML(aqhiResult.risk)}</span>`;
    } else {
        // 取不到時優雅顯示「--」
        display.textContent = '--';
    }
}

        async function fetchWeather(isManual = false) {
            if (isFetchingWeather) return;
            isFetchingWeather = true;

            const ts = Date.now();
            const rhrUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${ts}`;
            const fndUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_t=${ts}`;
            const flwUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc&_t=${ts}`;
            const warnUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc&_t=${ts}`;

            const statusEl = document.getElementById('status-display');
            const refreshBtnText = document.getElementById('refresh-btn-text');

            try {
                if (!hasInitialWeatherLoaded || isManual) {
                    statusEl.textContent = '更新中…';
                    if (refreshBtnText) refreshBtnText.textContent = '…';
                }

                const [rhr, fnd, flw, warnsum] = await Promise.all([
                    fetchJSON(rhrUrl, 8000, true),
                    fetchJSON(fndUrl, 8000, false),
                    fetchJSON(flwUrl, 8000, false).catch(() => null),
                    fetchJSON(warnUrl, 8000, false).catch(() => ({}))
                ]);

                renderCoreWeather(rhr, fnd, flw, warnsum);
                fetchAuxiliaryData(ts);

            } catch (err) {
                console.error('天氣數據讀取失敗:', err);
                statusEl.textContent = '讀取失敗';
            } finally {
                isFetchingWeather = false;
                if (refreshBtnText) refreshBtnText.textContent = '刷新';
            }
        }

        async function init() {
            document.getElementById('prev-month').addEventListener('click', async () => {
                displayedMonth--;
                if (displayedMonth < 0) { displayedMonth = 11; displayedYear--; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('next-month').addEventListener('click', async () => {
                displayedMonth++;
                if (displayedMonth > 11) { displayedMonth = 0; displayedYear++; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('reset-month').addEventListener('click', async () => {
                const now = getNow();
                displayedYear = now.getFullYear();
                displayedMonth = now.getMonth();
                await fetchHolidays(displayedYear);
                renderCalendar();
            });

            // 局部純數據刷新：杜絕跳轉與全螢幕黑白閃爍
            document.getElementById('refresh-btn').addEventListener('click', async (e) => {
                e.preventDefault();
                await fetchWeather(true);
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (clockTimer) { clearTimeout(clockTimer); clockTimer = null; }
                } else {
                    alignClock();
                    if (Date.now() - lastWeatherSuccessTime >= AUTO_REFRESH_INTERVAL_MS) {
                        fetchWeather(false);
                    }
                }
            });

            await fetchHolidays(displayedYear);
            alignClock();
            renderCalendar();
            await fetchWeather(true);
        }

        window.onload = init;
    </script>
