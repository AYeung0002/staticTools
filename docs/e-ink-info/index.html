<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-ink Smart Display-</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --eink-black: #000000;
            --eink-gray: #666666;
            --eink-white: #ffffff;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
            background-color: var(--eink-white);
            color: var(--eink-black);
            margin: 0;
            padding: 5px;
            box-sizing: border-box;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        ::-webkit-scrollbar { display: none; }
        .eink-black { background-color: #000; color: #fff; }
        .eink-border { border-color: #000; }
        .eink-text-gray { color: #666; }
        .tabular { font-variant-numeric: tabular-nums; }
        button:active { background-color: #000; color: #fff; }
        * { box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- 滿版容器 -->
    <div class="w-full h-full flex bg-white justify-between overflow-hidden">
        
        <!-- ================= 左側：時間與日曆 (佔比約 42%) ================= -->
        <div class="w-[42%] flex flex-col pr-3.5 py-1 border-r-[3px] eink-border justify-between h-full min-h-0">
            
            <!-- 時間與日期區域 -->
            <div class="text-center flex flex-col items-center flex-none">
                <div id="time-display" class="text-[5.8rem] font-black leading-[1] tracking-tighter tabular -mt-1 text-black">--:--</div>
                <div id="date-display" class="text-lg font-bold mt-1 tracking-wide text-black">載入中...</div>
                <div id="lunar-display" class="mt-1.5 border-2 eink-border rounded-lg px-3 py-0.5 text-base font-bold inline-block bg-white text-black">
                    --
                </div>
            </div>

            <!-- 日曆區域 -->
            <div class="flex-1 flex flex-col justify-between pt-2 min-h-0">
                <!-- 日曆標頭 -->
                <div class="flex justify-between items-center mb-1 flex-none px-0.5">
                    <div class="flex items-center gap-1.5 font-black text-xl text-black">
                        <i class="ph-bold ph-calendar-blank text-xl"></i>
                        <span id="calendar-month-title">-- / ----</span>
                    </div>
                    <div class="flex gap-1 text-black">
                        <button id="prev-month" class="border-2 eink-border rounded px-2 py-0.5 font-bold text-sm">◀</button>
                        <button id="reset-month" class="border-2 eink-border rounded px-2.5 py-0.5 font-bold text-sm" title="回到本月">今日</button>
                        <button id="next-month" class="border-2 eink-border rounded px-2 py-0.5 font-bold text-sm">▶</button>
                    </div>
                </div>

                <!-- 日曆網格容器 -->
                <div id="calendar-container" class="flex-1 flex flex-col justify-between min-h-0"></div>
            </div>
        </div>

        <!-- ================= 右側：天氣與預報 (佔比約 58%) ================= -->
        <div class="w-[58%] flex flex-col pl-3.5 py-1 justify-between bg-white h-full min-h-0">
            
            <!-- ① 警告橫幅 (有警告時自動展開，無警告收合) -->
            <div id="warning-bar" class="eink-black rounded-lg py-1 px-3 flex items-center justify-center gap-2 mb-1.5 hidden flex-none">
                <i class="ph-bold ph-warning text-lg text-white flex-none"></i>
                <span id="warning-text" class="text-sm font-bold tracking-wide truncate">--</span>
            </div>

            <!-- ② 當前天氣區域 -->
            <div class="flex justify-between items-start w-full relative min-h-[92px] flex-none">
                <!-- 左半部：大圖示 + 大氣溫 -->
                <div class="flex items-center gap-2.5">
                    <i id="main-icon" class="ph-fill ph-sun text-[4.8rem] text-black leading-none flex-none"></i>
                    <div id="temp-display" class="text-[4.8rem] font-black leading-none tabular tracking-tighter text-black">--°</div>
                </div>

                <!-- 右半部：地點切換按鈕 + 上下排列的天氣敘述 -->
                <div class="flex flex-col items-end pt-0.5 max-w-[13.5rem]">
                    <button id="station-toggle-btn" class="border-2 eink-border rounded-full px-3 py-0.5 flex items-center gap-1 text-sm font-bold bg-white active:bg-black active:text-white whitespace-nowrap">
                        <i class="ph-bold ph-map-pin text-xs"></i>
                        <span id="station-name">油麻地</span>
                        <i class="ph-bold ph-caret-down text-[10px] text-[#666]"></i>
                    </button>
                    <div id="weather-desc" class="text-base font-black text-right mt-1.5 leading-snug text-black">
                        載入中...
                    </div>
                </div>
            </div>
            
            <!-- 今日最高最低溫 (純讀數大字體) -->
            <div id="temp-range" class="text-2xl font-black my-0.5 pl-1 tabular flex-none text-black">
                --° / --°
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-[2.5px] bg-black my-0.5 flex-none"></div>

            <!-- ③ 氣象細節：純 Icon + 數值 (2x2 緊密高對比) -->
            <div class="grid grid-cols-2 gap-x-4 gap-y-1.5 py-1 pl-1 pr-2 flex-none">
                <!-- 相對濕度 -->
                <div class="flex items-center gap-2.5">
                    <i class="ph-bold ph-drop text-2xl text-black flex-none"></i>
                    <span id="humidity-display" class="text-2xl font-black tabular">--%</span>
                </div>
                <!-- 紫外線指數 -->
                <div class="flex items-center gap-2.5">
                    <i class="ph-bold ph-sun text-2xl text-black flex-none"></i>
                    <span id="uv-display" class="text-2xl font-black truncate">--</span>
                </div>
                <!-- 風力風向 -->
                <div class="flex items-center gap-2.5">
                    <i class="ph-bold ph-wind text-2xl text-black flex-none"></i>
                    <span id="wind-display" class="text-2xl font-black truncate">--</span>
                </div>
                <!-- 降雨概率 -->
                <div class="flex items-center gap-2.5">
                    <i class="ph-bold ph-umbrella text-2xl text-black flex-none"></i>
                    <span id="psr-display" class="text-2xl font-black truncate">--</span>
                </div>
            </div>

            <!-- 分隔線 -->
            <div class="w-full h-[2.5px] bg-black my-1 flex-none"></div>

            <!-- ④ 未來五天預報區域 -->
            <div class="flex flex-col flex-1 min-h-0 justify-between">
                <!-- 標題與更新按鈕 -->
                <div class="flex justify-between items-end mb-1 flex-none px-0.5">
                    <div class="flex items-center gap-1.5 text-base font-bold text-black">
                        <i class="ph-bold ph-calendar-check text-lg"></i>
                        未來五天 <span id="status-display" class="text-xs eink-text-gray font-bold ml-1">載入中...</span>
                    </div>
                    <button id="mode-btn" class="border-2 eink-border rounded px-2 py-0.5 text-xs font-bold flex items-center gap-1 active:bg-black active:text-white" title="切換刷新頻率">
                        <i id="mode-icon" class="ph-bold ph-arrows-clockwise text-xs"></i>
                        <span id="mode-text">15分</span>
                    </button>
                </div>

                <!-- 五天卡片 -->
                <div id="forecast-row" class="grid grid-cols-5 gap-1.5 flex-1 min-h-0 pb-0.5"></div>
            </div>

        </div>
    </div>

    <script>
        let hkHolidays = {};
        let displayedYear = new Date().getFullYear();
        let displayedMonth = new Date().getMonth();
        let clockTimer = null;
        let weatherTimer = null;
        let isFastMode = false;

        let currentStationIndex = parseInt(localStorage.getItem('eink_station_pref') || '0', 10);
        const STATIONS = [
            { label: '油麻地', keys: ['京士柏', '香港天文台'] },
            { label: '尖沙咀', keys: ['香港天文台', '九龍城'] }
        ];
        let cachedRhrData = null;

        /* ================= 1. 香港公眾假期 ================= */
        async function fetchHolidays(year) {
            if (hkHolidays[year]) return;
            try {
                const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`);
                const data = await res.json();
                hkHolidays[year] = data.map(ev => ev.date.replace(/-/g, ''));
            } catch (e) {
                hkHolidays[year] = [];
            }
        }

        /* ================= 2. 中文傳統農曆轉換 ================= */
        function getLunarText(d) {
            try {
                const formatter = new Intl.DateTimeFormat('zh-u-ca-chinese', { month: 'numeric', day: 'numeric' });
                const text = formatter.format(d);
                const nums = text.match(/\d+/g);
                if (nums && nums.length >= 2) {
                    const m = parseInt(nums[0], 10);
                    const day = parseInt(nums[1], 10);
                    const monthNames = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "臘"];
                    const mStr = monthNames[m - 1] || `${m}`;
                    let dayStr = "";
                    if (day <= 10) dayStr = "初" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"][day];
                    else if (day < 20) dayStr = "十" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 10];
                    else if (day === 20) dayStr = "二十";
                    else if (day < 30) dayStr = "廿" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 20];
                    else if (day === 30) dayStr = "三十";
                    return `農曆${mStr}月${dayStr}`;
                }
                return `農曆 ${text}`;
            } catch (e) {
                return '';
            }
        }

        /* ================= 3. 月曆生成 (符合 Mockup 風格) ================= */
        function renderCalendar() {
            const now = new Date();
            const year = displayedYear, month = displayedMonth;
            const today = now.getDate();
            document.getElementById('calendar-month-title').innerText =
                `${String(month + 1).padStart(2, '0')} / ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let headerHtml = `<div class="grid grid-cols-7 text-center pb-1 border-b-2 eink-border text-base font-bold flex-none">`;
            ['日','一','二','三','四','五','六'].forEach(d => {
                const isWeekend = d === '日' || d === '六';
                headerHtml += `<div class="${isWeekend ? 'eink-text-gray' : 'text-black'}">${d}</div>`;
            });
            headerHtml += `</div>`;

            let bodyHtml = `<div class="grid grid-cols-7 text-center flex-1 content-around text-lg font-bold">`;
            for (let i = 0; i < firstDay; i++) bodyHtml += `<div></div>`;

            const currentHolidays = hkHolidays[year] || [];
            const isViewingCurrentMonth = (year === now.getFullYear() && month === now.getMonth());
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}${String(month+1).padStart(2,'0')}${String(i).padStart(2,'0')}`;
                const dow = new Date(year, month, i).getDay();
                const isWeekend = dow === 0 || dow === 6;
                const isHoliday = currentHolidays.includes(dateStr);
                const isToday = isViewingCurrentMonth && (i === today);

                let textClass = "leading-none ";
                let circleClass = "w-7 h-7 flex items-center justify-center mx-auto rounded-full ";
                
                if (isToday) {
                    circleClass += "eink-black ";
                    textClass += "text-white ";
                } else {
                    textClass += (isHoliday || isWeekend) ? "eink-text-gray " : "text-black ";
                }

                const marker = (isHoliday && !isToday)
                    ? `<div class="w-1.5 h-1.5 rounded-full bg-gray-600 mt-0.5 mx-auto"></div>`
                    : `<div class="w-1.5 h-1.5 mt-0.5 opacity-0"></div>`;

                bodyHtml += `<div class="flex flex-col items-center justify-center py-0.5">
                    <div class="${circleClass}"><span class="${textClass}">${i}</span></div>
                    ${marker}
                </div>`;
            }
            bodyHtml += `</div>`;
            document.getElementById('calendar-container').innerHTML = `${headerHtml}${bodyHtml}`;
        }

        /* ================= 4. 時鐘與日期同步 ================= */
        function formatTime(d) {
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        function updateTimeUI() {
            const now = new Date();
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('date-display').innerText =
                `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;
            document.getElementById('lunar-display').innerText = getLunarText(now);
            document.getElementById('time-display').innerText = formatTime(now);

            if (displayedYear === now.getFullYear() && displayedMonth === now.getMonth()) {
                const cur = document.querySelector('.eink-black.rounded-full');
                if (!cur || cur.innerText.trim() !== String(now.getDate())) renderCalendar();
            }
        }

        function alignClock() {
            updateTimeUI();
            const now = new Date();
            const msToNextMinute = 60000 - (now.getSeconds()*1000 + now.getMilliseconds());
            clockTimer = setTimeout(alignClock, msToNextMinute);
        }

        /* ================= 5. 香港天文台圖標映射 (全覆蓋) ================= */
        function weatherIcon(rawCode) {
            const code = Array.isArray(rawCode) ? parseInt(rawCode[0], 10) : parseInt(rawCode, 10);
            if (isNaN(code)) return 'ph-sun';
            if (code >= 50 && code <= 52) return 'ph-sun';
            if (code === 53 || code === 54) return 'ph-cloud-sun';
            if (code === 60 || code === 61) return 'ph-cloud';
            if (code >= 62 && code <= 65) return 'ph-cloud-rain';
            if (code >= 70 && code <= 77) return (code <= 73) ? 'ph-sun' : 'ph-cloud-sun';
            if (code >= 80 && code <= 84) return 'ph-wind';
            if (code === 85 || code === 86) return 'ph-cloud-fog';
            if (code >= 90 && code <= 93) return 'ph-cloud-lightning';
            return 'ph-sun-dim';
        }

        /* ================= 6. 地點切換與數據同步 ================= */
        function updateStationTemperature() {
            if (!cachedRhrData) return;
            const tempData = cachedRhrData.temperature?.data || [];
            const activeStation = STATIONS[currentStationIndex];
            document.getElementById('station-name').textContent = activeStation.label;

            let matched = null;
            for (const key of activeStation.keys) {
                matched = tempData.find(d => d.place && d.place.includes(key));
                if (matched) break;
            }
            if (!matched) matched = tempData[0];

            if (matched) {
                const v = parseFloat(matched.value);
                document.getElementById('temp-display').textContent = isNaN(v) ? '--°' : `${Math.round(v)}°`;
            }
        }

        function toggleStation() {
            currentStationIndex = (currentStationIndex + 1) % STATIONS.length;
            localStorage.setItem('eink_station_pref', currentStationIndex);
            updateStationTemperature();
        }

        /* ================= 7. 天氣主數據流程 ================= */
        async function fetchWeather() {
            const ts = Date.now();
            const rhrUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${ts}`;
            const fndUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_t=${ts}`;
            const statusEl = document.getElementById('status-display');

            async function fetchJSON(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            }

            try {
                statusEl.textContent = '更新中…';
                const [rhr, fnd] = await Promise.all([fetchJSON(rhrUrl), fetchJSON(fndUrl)]);
                cachedRhrData = rhr;

                // ① 警告條
                const warnings = Array.isArray(rhr.warningMessage)
                    ? rhr.warningMessage
                    : (rhr.warningMessage ? [rhr.warningMessage] : []);
                const warningText = warnings.map(w => String(w).trim()).filter(Boolean).join(' / ');
                const warnBar = document.getElementById('warning-bar');
                if (warningText) {
                    document.getElementById('warning-text').textContent = warningText;
                    warnBar.classList.remove('hidden');
                } else {
                    warnBar.classList.add('hidden');
                }

                // ② 即時氣溫
                updateStationTemperature();

                // ③ 濕度
                const humObj = rhr.humidity?.data?.[0];
                if (humObj && humObj.value !== undefined) {
                    document.getElementById('humidity-display').textContent = `${humObj.value}%`;
                }

                // ④ 紫外線
                const uvObj = rhr.uvindex?.data?.[0];
                if (uvObj) {
                    const uvVal = uvObj.value ?? '';
                    const uvDesc = uvObj.desc ? ` (${uvObj.desc})` : '';
                    document.getElementById('uv-display').innerHTML = `${uvVal} <span class="text-base font-bold">${uvDesc}</span>`;
                } else {
                    document.getElementById('uv-display').textContent = '0 (低)';
                }

                // ⑤ 天氣主圖標
                if (rhr.icon && rhr.icon.length > 0) {
                    document.getElementById('main-icon').className =
                        `ph-fill ${weatherIcon(rhr.icon[0])} text-[4.8rem] text-black leading-none flex-none`;
                }

                // ⑥ 九天天氣預報
                const fc = fnd.weatherForecast || [];
                if (fc.length > 0) {
                    const today = fc[0];
                    
                    // 天氣描述：自動在句點/分號斷行垂直顯示
                    const rawDesc = today.forecastWeather || '--';
                    const descParts = rawDesc.replace(/[。！]$/, '').split(/[。，；]/).filter(Boolean);
                    if (descParts.length > 1) {
                        document.getElementById('weather-desc').innerHTML = descParts.slice(0, 2).join('<br>');
                    } else {
                        document.getElementById('weather-desc').textContent = rawDesc;
                    }

                    // 今日最高 / 最低溫
                    document.getElementById('temp-range').textContent =
                        `${today.forecastMaxtemp?.value}° / ${today.forecastMintemp?.value}°`;

                    // 風力簡述
                    if (today.forecastWind) {
                        let w = today.forecastWind.replace(/[。，]/g, '').trim();
                        document.getElementById('wind-display').textContent = w;
                    }
                    
                    // 降雨概率
                    if (today.PSR) {
                        document.getElementById('psr-display').textContent = today.PSR;
                    }

                    // 5日卡片
                    const now = new Date();
                    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const currentYearHolidays = hkHolidays[now.getFullYear()] || [];

                    const days = fc.slice(0, 5).map(wf => {
                        const fd = wf.forecastDate || '';
                        const d = new Date(+fd.slice(0,4), +fd.slice(4,6)-1, +fd.slice(6,8));
                        const diff = Math.round((d - todayMid) / 86400000);
                        const weekDay = ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];
                        const dateStr = `${d.getMonth()+1}/${d.getDate()}`;
                        const isHoliday = currentYearHolidays.includes(fd);
                        const isWeekend = d.getDay() === 0 || d.getDay() === 6;

                        return {
                            weekDay,
                            dateStr,
                            isTomorrow: diff === 1,
                            isHoliday,
                            isWeekend,
                            max: wf.forecastMaxtemp?.value ?? '--',
                            min: wf.forecastMintemp?.value ?? '--',
                            icon: weatherIcon(wf.forecastIcon)
                        };
                    });

                    document.getElementById('forecast-row').innerHTML = days.map((d, index) => {
                        const isFirst = index === 0;
                        const bgClass = isFirst ? 'bg-gray-100' : 'bg-white';
                        const dotClass = (d.isHoliday || d.isTomorrow) ? '<div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div>' : '';

                        return `
                        <div class="border-[2.5px] eink-border rounded-xl flex flex-col items-center justify-between py-1.5 ${bgClass} h-full min-h-0">
                            <div class="text-base font-black leading-tight mt-0.5 flex flex-col items-center gap-0.5 text-black">
                                <span>${d.weekDay}</span>
                                ${dotClass}
                            </div>
                            <div class="text-xs font-bold eink-text-gray mb-0.5">${d.dateStr}</div>
                            <i class="ph-fill ${d.icon} text-3xl text-black my-auto"></i>
                            <div class="mt-0.5 flex flex-col items-center leading-none gap-0.5">
                                <span class="text-xl font-black text-black tabular">${d.max}°</span>
                                <span class="text-sm font-bold eink-text-gray tabular">${d.min}°</span>
                            </div>
                        </div>`;
                    }).join('');
                }

                statusEl.textContent = `更新於 ${new Date().toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit'})}`;
            } catch (err) {
                console.error('天氣讀取失敗:', err);
                statusEl.textContent = '讀取失敗';
            }
        }

        /* ================= 8. 輪詢頻率與事件監聽 ================= */
        function startWeatherTimer() {
            if (weatherTimer) clearInterval(weatherTimer);
            weatherTimer = setInterval(fetchWeather, isFastMode ? 5*60*1000 : 15*60*1000);
        }

        function toggleMode() {
            isFastMode = !isFastMode;
            const text = document.getElementById('mode-text');
            if (isFastMode) {
                text.textContent = '5分';
            } else {
                text.textContent = '15分';
            }
            fetchWeather();
            startWeatherTimer();
        }

        async function init() {
            document.getElementById('prev-month').addEventListener('click', async () => {
                displayedMonth--;
                if (displayedMonth < 0) { displayedMonth = 11; displayedYear--; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('next-month').addEventListener('click', async () => {
                displayedMonth++;
                if (displayedMonth > 11) { displayedMonth = 0; displayedYear++; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('reset-month').addEventListener('click', async () => {
                const now = new Date();
                displayedYear = now.getFullYear();
                displayedMonth = now.getMonth();
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('mode-btn').addEventListener('click', toggleMode);
            document.getElementById('station-toggle-btn').addEventListener('click', toggleStation);

            await fetchHolidays(displayedYear);
            alignClock();
            renderCalendar();
            await fetchWeather();
            startWeatherTimer();
        }

        window.onload = init;
    </script>
</body>
</html>
