<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E-ink Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --eink-black: #000000;
            --eink-gray: #555555;
            --eink-white: #ffffff;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--eink-white);
            color: var(--eink-black);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang HK",
                         "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .eink-border-r { border-right: 2px solid #000; }
        .eink-divider { border-bottom: 2px solid #000; }
        .eink-card { border: 2px solid #000; border-radius: 6px; }
        .tabular { font-variant-numeric: tabular-nums; }
        ::-webkit-scrollbar { display: none; }
        button:active { background-color: #000; color: #fff; }
        * { box-sizing: border-box; }
    </style>
</head>
<body class="w-full h-full flex p-3 gap-3.5 box-border overflow-hidden bg-white text-black">

    <!-- ========== 左側：時間 + 月曆（高度均勻填滿） ========== -->
    <aside class="w-1/2 flex flex-col eink-border-r pr-3.5 h-full min-h-0 justify-between">
        <!-- 頂部時鐘與農曆（等比放大） -->
        <div class="flex-none flex flex-col items-center justify-center pb-3 eink-divider">
            <div id="time-display" class="text-[5.8rem] leading-none font-black tracking-tight text-black tabular">--:--</div>
            <div class="flex items-center gap-2 mt-2 flex-wrap justify-center">
                <span id="date-display" class="text-base font-black text-black">載入中...</span>
                <span id="lunar-display" class="text-xs font-bold px-2 py-0.5 rounded border border-black bg-white"></span>
            </div>
        </div>

        <!-- 月曆區塊（行距呼吸適中，徹底解決底部 1/3 空白） -->
        <div class="flex-1 flex flex-col justify-between pt-2.5 pb-1 min-h-0">
            <div class="flex items-center justify-between px-1 text-base font-black text-black flex-none mb-1.5">
                <div class="flex items-center gap-1.5">
                    <i class="ph-bold ph-calendar-blank text-lg"></i>
                    <span id="calendar-month-title" class="text-base tracking-wide">--</span>
                </div>
                <div class="flex items-center gap-1.5 text-black">
                    <button id="prev-month" class="px-2.5 py-0.5 rounded border border-black text-xs font-bold active:bg-black active:text-white">◀</button>
                    <button id="reset-month" class="px-2.5 py-0.5 rounded border border-black text-xs font-bold active:bg-black active:text-white" title="回到本月">今日</button>
                    <button id="next-month" class="px-2.5 py-0.5 rounded border border-black text-xs font-bold active:bg-black active:text-white">▶</button>
                </div>
            </div>
            
            <div id="calendar-container" class="flex-1 flex flex-col justify-between min-h-0"></div>
        </div>
    </aside>

    <!-- ========== 右側：天氣資訊（空間均衡舒展） ========== -->
    <main class="w-1/2 flex flex-col h-full min-h-0 pl-0.5 justify-between">

        <!-- ① 警告條 -->
        <div id="warning-bar"
             class="flex-none min-h-[26px] mb-2 flex items-center justify-center px-3 py-1 rounded bg-black text-white text-xs font-bold hidden border border-black">
            <i class="ph-bold ph-warning mr-1.5 text-sm"></i>
            <span id="warning-text" class="truncate">--</span>
        </div>

        <!-- ② 實時主天氣（右上角按鈕 + 垂直描述文字 + 左側超大視覺中心） -->
        <section class="flex-none flex items-stretch justify-between py-2 px-2 eink-divider min-h-[110px]">
            <!-- 左側焦點：大圖標 + 大氣溫 + 溫度區間 -->
            <div class="flex items-center gap-3">
                <i id="main-icon" class="ph-fill ph-sun text-[4.8rem] text-black flex-none leading-none"></i>
                <div class="flex flex-col justify-center">
                    <div id="temp-display" class="text-[4.2rem] leading-none font-black tracking-tighter text-black tabular">--°</div>
                    <div class="text-xs font-bold text-[#555] mt-1.5 tracking-tight">
                        <span id="temp-range">最高 --° / 最低 --°</span>
                    </div>
                </div>
            </div>

            <!-- 右側對齊線：右上角按鈕 + 正下方垂直排列天氣描述 -->
            <div class="flex flex-col items-end justify-between py-0.5 pl-2 max-w-[12.5rem]">
                <button id="station-toggle-btn" class="flex items-center gap-1.5 px-3 py-1 rounded-full border border-black text-xs font-black bg-white active:bg-black active:text-white whitespace-nowrap">
                    <i class="ph-bold ph-map-pin text-xs"></i>
                    <span id="station-name">油麻地</span>
                    <i class="ph-bold ph-caret-down text-[10px] text-[#555]"></i>
                </button>
                <div id="weather-desc" class="text-xs font-bold text-black text-right leading-snug mt-auto flex flex-col items-end">
                    載入中...
                </div>
            </div>
        </section>

        <!-- ③ 實時環境詳情（整體放大 1.3 倍，增加垂直間距填充中段空間） -->
        <section class="flex-none grid grid-cols-2 gap-x-4 gap-y-3 px-3 py-3 text-sm font-bold eink-divider">
            <div class="flex items-center gap-2"><i class="ph-fill ph-drop text-lg text-black"></i>相對濕度：<span id="humidity-display" class="tabular font-black">--%</span></div>
            <div class="flex items-center gap-2"><i class="ph-fill ph-sun-horizon text-lg text-black"></i>紫外線指數：<span id="uv-display" class="tabular font-black">--</span></div>
            <div class="flex items-center gap-2"><i class="ph-fill ph-wind text-lg text-black"></i>風向風級：<span id="wind-display" class="truncate font-black">--</span></div>
            <div class="flex items-center gap-2"><i class="ph-fill ph-umbrella text-lg text-black"></i>降雨概率：<span id="psr-display" class="tabular font-black">--</span></div>
        </section>

        <!-- ④ 預報區（高度適中，自然銜接上方擴展後的版面） -->
        <section class="flex-1 flex flex-col justify-between pt-2.5 min-h-0">
            <div class="flex-none flex items-center justify-between text-xs font-black text-black mb-1.5 px-1">
                <div class="flex items-center gap-1.5">
                    <i class="ph-bold ph-calendar-check text-sm"></i>
                    <span>未來五天預報</span>
                    <span id="status-display" class="ml-1 text-[#666] font-normal text-[11px]"></span>
                </div>
                <button id="mode-btn" class="flex items-center gap-1 text-[11px] px-2 py-0.5 rounded border border-black font-bold active:bg-black active:text-white" title="切換更新頻率">
                    <i id="mode-icon" class="ph-bold ph-arrows-clockwise text-xs"></i>
                    <span id="mode-text">↻ 15m 更新</span>
                </button>
            </div>
            
            <!-- 5日卡片 -->
            <div id="forecast-row" class="grid grid-cols-5 gap-1.5 items-stretch h-[125px]"></div>
        </section>
    </main>

    <script>
        let hkHolidays = {};
        let displayedYear = new Date().getFullYear();
        let displayedMonth = new Date().getMonth();
        let clockTimer = null;
        let weatherTimer = null;
        let isFastMode = false;

        let currentStationIndex = parseInt(localStorage.getItem('eink_station_pref') || '0', 10);
        const STATIONS = [
            { label: '油麻地', keys: ['京士柏', '香港天文台'] },
            { label: '尖沙咀', keys: ['香港天文台', '九龍城'] }
        ];
        let cachedRhrData = null;

        /* ================= 1. 公眾假期 ================= */
        async function fetchHolidays(year) {
            if (hkHolidays[year]) return;
            try {
                const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/HK`);
                const data = await res.json();
                hkHolidays[year] = data.map(ev => ev.date.replace(/-/g, ''));
            } catch (e) {
                hkHolidays[year] = [];
            }
        }

        /* ================= 2. 中文傳統農曆格式化 ================= */
        function getLunarText(d) {
            try {
                const formatter = new Intl.DateTimeFormat('zh-u-ca-chinese', { month: 'numeric', day: 'numeric' });
                const text = formatter.format(d);
                const nums = text.match(/\d+/g);
                if (nums && nums.length >= 2) {
                    const m = parseInt(nums[0], 10);
                    const day = parseInt(nums[1], 10);
                    const monthNames = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "臘"];
                    const mStr = monthNames[m - 1] || `${m}`;
                    let dayStr = "";
                    if (day <= 10) dayStr = "初" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"][day];
                    else if (day < 20) dayStr = "十" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 10];
                    else if (day === 20) dayStr = "二十";
                    else if (day < 30) dayStr = "廿" + ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 20];
                    else if (day === 30) dayStr = "三十";
                    return `農曆${mStr}月${dayStr}`;
                }
                return `農曆 ${text}`;
            } catch (e) {
                return '';
            }
        }

        /* ================= 3. 月曆（呼吸感與聚合度平衡） ================= */
        function renderCalendar() {
            const now = new Date();
            const year = displayedYear, month = displayedMonth;
            const today = now.getDate();
            document.getElementById('calendar-month-title').innerText =
                `${String(month + 1).padStart(2, '0')} / ${year}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let headerHtml = `<div class="grid grid-cols-7 text-center mb-1.5 border-b border-black/20 pb-1 flex-none">`;
            ['日','一','二','三','四','五','六'].forEach(d => {
                const isWeekend = d === '日' || d === '六';
                headerHtml += `<div class="font-black text-xs ${isWeekend ? 'text-[#555]' : 'text-black'}">${d}</div>`;
            });
            headerHtml += `</div>`;

            // content-around 自適應縱向填滿剩餘高度，杜絕大面積空白
            let bodyHtml = `<div class="grid grid-cols-7 text-center flex-1 content-around items-center">`;
            for (let i = 0; i < firstDay; i++) bodyHtml += `<div></div>`;

            const currentHolidays = hkHolidays[year] || [];
            const isViewingCurrentMonth = (year === now.getFullYear() && month === now.getMonth());
            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}${String(month+1).padStart(2,'0')}${String(i).padStart(2,'0')}`;
                const dow = new Date(year, month, i).getDay();
                const isWeekend = dow === 0 || dow === 6;
                const isHoliday = currentHolidays.includes(dateStr);
                const isToday = isViewingCurrentMonth && (i === today);

                let textClass = "text-sm font-bold leading-none ";
                let circleClass = "flex items-center justify-center h-7 w-7 mx-auto rounded-full box-border ";
                
                if (isToday) {
                    circleClass += "bg-black text-white ";
                    textClass += "text-white ";
                } else {
                    textClass += (isHoliday || isWeekend) ? "text-[#666] " : "text-black ";
                }
                const marker = (isHoliday && !isToday)
                    ? `<div class="w-1.5 h-1.5 bg-black rounded-full mt-0.5"></div>`
                    : `<div class="w-1.5 h-1.5 mt-0.5 opacity-0"></div>`;

                bodyHtml += `<div class="flex flex-col items-center justify-center py-0.5"><div class="${circleClass}"><span class="${textClass}">${i}</span></div>${marker}</div>`;
            }
            bodyHtml += `</div>`;
            document.getElementById('calendar-container').innerHTML = `${headerHtml}${bodyHtml}`;
        }

        /* ================= 4. 時鐘與日期 ================= */
        function formatTime(d) {
            return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
        }

        function updateTimeUI() {
            const now = new Date();
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('date-display').innerText =
                `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (星期${days[now.getDay()]})`;
            document.getElementById('lunar-display').innerText = getLunarText(now);
            document.getElementById('time-display').innerText = formatTime(now);

            if (displayedYear === now.getFullYear() && displayedMonth === now.getMonth()) {
                const cur = document.querySelector('.bg-black.text-white');
                if (!cur || cur.innerText !== String(now.getDate())) renderCalendar();
            }
        }

        function alignClock() {
            updateTimeUI();
            const now = new Date();
            const msToNextMinute = 60000 - (now.getSeconds()*1000 + now.getMilliseconds());
            clockTimer = setTimeout(alignClock, msToNextMinute);
        }

        /* ================= 5. 天氣圖標映射 ================= */
        function weatherIcon(rawCode) {
            const code = Array.isArray(rawCode) ? parseInt(rawCode[0], 10) : parseInt(rawCode, 10);
            if (isNaN(code)) return 'ph-sun';
            if (code >= 50 && code <= 52) return 'ph-sun';
            if (code === 53 || code === 54) return 'ph-cloud-sun';
            if (code === 60 || code === 61) return 'ph-cloud';
            if (code >= 62 && code <= 65) return 'ph-cloud-rain';
            if (code >= 70 && code <= 77) return (code <= 73) ? 'ph-sun' : 'ph-cloud-sun';
            if (code >= 80 && code <= 84) return 'ph-wind';
            if (code === 85 || code === 86) return 'ph-cloud-fog';
            if (code >= 90 && code <= 93) return 'ph-cloud-lightning';
            return 'ph-sun-dim';
        }

        /* ================= 6. 站點氣溫切換 ================= */
        function updateStationTemperature() {
            if (!cachedRhrData) return;
            const tempData = cachedRhrData.temperature?.data || [];
            const activeStation = STATIONS[currentStationIndex];
            document.getElementById('station-name').textContent = activeStation.label;

            let matched = null;
            for (const key of activeStation.keys) {
                matched = tempData.find(d => d.place && d.place.includes(key));
                if (matched) break;
            }
            if (!matched) matched = tempData[0];

            if (matched) {
                const v = parseFloat(matched.value);
                document.getElementById('temp-display').textContent = isNaN(v) ? '--°' : `${Math.round(v)}°`;
            }
        }

        function toggleStation() {
            currentStationIndex = (currentStationIndex + 1) % STATIONS.length;
            localStorage.setItem('eink_station_pref', currentStationIndex);
            updateStationTemperature();
        }

        /* ================= 7. 天氣主流程 ================= */
        async function fetchWeather() {
            const ts = Date.now();
            const rhrUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc&_t=${ts}`;
            const fndUrl = `https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc&_t=${ts}`;
            const statusEl = document.getElementById('status-display');

            async function fetchJSON(url) {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            }

            try {
                statusEl.textContent = '更新中…';
                const [rhr, fnd] = await Promise.all([fetchJSON(rhrUrl), fetchJSON(fndUrl)]);
                cachedRhrData = rhr;

                // 警告條
                const warnings = Array.isArray(rhr.warningMessage)
                    ? rhr.warningMessage
                    : (rhr.warningMessage ? [rhr.warningMessage] : []);
                const warningText = warnings.map(w => String(w).trim()).filter(Boolean).join(' / ');
                const warnBar = document.getElementById('warning-bar');
                if (warningText) {
                    document.getElementById('warning-text').textContent = warningText;
                    warnBar.classList.remove('hidden');
                } else {
                    warnBar.classList.add('hidden');
                }

                // 實時氣溫
                updateStationTemperature();

                // 濕度
                const humObj = rhr.humidity?.data?.[0];
                if (humObj && humObj.value !== undefined) {
                    document.getElementById('humidity-display').textContent = `${humObj.value}%`;
                }

                // UV
                const uvObj = rhr.uvindex?.data?.[0];
                if (uvObj) {
                    const uvVal = uvObj.value ?? '';
                    const uvDesc = uvObj.desc ?? '';
                    document.getElementById('uv-display').textContent = `${uvVal} (${uvDesc})`.trim() || '--';
                }

                // 主圖標
                if (rhr.icon && rhr.icon.length > 0) {
                    document.getElementById('main-icon').className =
                        `ph-fill ${weatherIcon(rhr.icon[0])} text-[4.8rem] text-black flex-none leading-none`;
                }

                // 天氣預報
                const fc = fnd.weatherForecast || [];
                if (fc.length > 0) {
                    const today = fc[0];
                    
                    // 天氣描述垂直分行處理（以標點符號分割為俐落上下兩行）
                    const rawDesc = today.forecastWeather || '--';
                    const descParts = rawDesc.replace(/[。！]$/, '').split(/[。，；]/).filter(Boolean);
                    if (descParts.length > 1) {
                        document.getElementById('weather-desc').innerHTML = descParts.map(p => `<span>${p}</span>`).join('');
                    } else {
                        document.getElementById('weather-desc').textContent = rawDesc;
                    }

                    document.getElementById('temp-range').textContent = `最高 ${today.forecastMaxtemp?.value}° / 最低 ${today.forecastMintemp?.value}°`;

                    if (today.forecastWind) {
                        document.getElementById('wind-display').textContent = today.forecastWind.replace(/[。，]/g, '').trim();
                    }
                    if (today.PSR) {
                        document.getElementById('psr-display').textContent = `${today.PSR}`;
                    }

                    const now = new Date();
                    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const days = fc.slice(0, 5).map(wf => {
                        const fd = wf.forecastDate || '';
                        const d = new Date(+fd.slice(0,4), +fd.slice(4,6)-1, +fd.slice(6,8));
                        const diff = Math.round((d - todayMid) / 86400000);
                        const weekDay = ['週日','週一','週二','週三','週四','週五','週六'][d.getDay()];
                        const title = (diff === 1) ? `${weekDay} (明)` : weekDay;
                        const dateStr = `${d.getMonth()+1}/${d.getDate()}`;

                        return {
                            title,
                            dateStr,
                            max: wf.forecastMaxtemp?.value ?? '--',
                            min: wf.forecastMintemp?.value ?? '--',
                            icon: weatherIcon(wf.forecastIcon),
                            psr: wf.PSR || ''
                        };
                    });

                    // 5日卡片
                    document.getElementById('forecast-row').innerHTML = days.map(d => `
                        <div class="flex flex-col items-center justify-between eink-card py-2 px-1 bg-white h-full">
                            <div class="flex flex-col items-center">
                                <span class="text-xs font-black text-black leading-none">${d.title}</span>
                                <span class="text-[10px] font-bold text-[#666] leading-none mt-1">${d.dateStr}</span>
                            </div>
                            
                            <div class="flex flex-col items-center justify-center my-0.5">
                                <i class="ph-fill ${d.icon} text-2xl text-black"></i>
                                ${d.psr ? `<span class="text-[10px] font-black text-black mt-1 leading-none">雨:${d.psr}</span>` : `<span class="text-[10px] text-transparent mt-1 leading-none">-</span>`}
                            </div>
                            
                            <div class="flex flex-col items-center leading-none">
                                <span class="text-sm font-black text-black tabular">${d.max}°</span>
                                <span class="text-xs font-bold text-[#555] tabular mt-1">${d.min}°</span>
                            </div>
                        </div>
                    `).join('');
                }

                statusEl.textContent = `${new Date().toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit'})}`;
            } catch (err) {
                console.error('天氣讀取失敗:', err);
                statusEl.textContent = '讀取失敗';
            }
        }

        /* ================= 8. 定時器與初始化 ================= */
        function startWeatherTimer() {
            if (weatherTimer) clearInterval(weatherTimer);
            weatherTimer = setInterval(fetchWeather, isFastMode ? 5*60*1000 : 15*60*1000);
        }

        function toggleMode() {
            isFastMode = !isFastMode;
            const text = document.getElementById('mode-text');
            if (isFastMode) {
                text.textContent = '↻ 5m 更新';
            } else {
                text.textContent = '↻ 15m 更新';
            }
            fetchWeather();
            startWeatherTimer();
        }

        async function init() {
            document.getElementById('prev-month').addEventListener('click', async () => {
                displayedMonth--;
                if (displayedMonth < 0) { displayedMonth = 11; displayedYear--; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('next-month').addEventListener('click', async () => {
                displayedMonth++;
                if (displayedMonth > 11) { displayedMonth = 0; displayedYear++; }
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('reset-month').addEventListener('click', async () => {
                const now = new Date();
                displayedYear = now.getFullYear();
                displayedMonth = now.getMonth();
                await fetchHolidays(displayedYear);
                renderCalendar();
            });
            document.getElementById('mode-btn').addEventListener('click', toggleMode);
            document.getElementById('station-toggle-btn').addEventListener('click', toggleStation);

            await fetchHolidays(displayedYear);
            alignClock();
            renderCalendar();
            await fetchWeather();
            startWeatherTimer();
        }

        window.onload = init;
    </script>
</body>
</html>
