<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-ink 屏幕信息</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;              /* 关键：强制一屏，不滚动 */
    background: #fff;
    color: #000;
    font-family: monospace, system-ui, sans-serif;
    font-size: clamp(11px, 2.0vh, 15px);  /* 根据屏幕高度自动缩放 */
    line-height: 1.35;
  }

  body {
    padding: 8px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.2em;
    line-height: 1.2;
  }

  #output {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px 12px;
  }

  .item {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 1px 0;
    border-bottom: 1px solid #000;
    min-width: 0;
  }

  .item.full {
    grid-column: 1 / -1;
  }

  .label {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .value {
    flex: 1 1 auto;
    text-align: right;
    font-weight: bold;
    word-break: break-all;
    min-width: 0;
  }

  .warn {
    text-decoration: underline;
  }
</style>
</head>
<body>
<h1>E-ink 屏幕详细参数</h1>
<div id="output"></div>

<script>
(function () {
  const output = document.getElementById('output');

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function log(label, value, full, warn) {
    const div = document.createElement('div');
    div.className = 'item' + (full ? ' full' : '');
    div.innerHTML =
      '<span class="label">' + esc(label) + ':</span>' +
      '<span class="value' + (warn ? ' warn' : '') + '">' + esc(value) + '</span>';
    output.appendChild(div);
  }

  const dpr = window.devicePixelRatio || 1;
  const mqMonochrome = window.matchMedia('(monochrome: 1)').matches;
  const mqCoarse = window.matchMedia('(pointer: coarse)').matches;
  const mqUpdateSlow = window.matchMedia('(update: slow)').matches;
  const mqResolution1dppx = window.matchMedia('(resolution: 1dppx)').matches;
  const isLikelyEink = mqMonochrome && mqCoarse && mqUpdateSlow;

  log('视口宽 innerWidth', window.innerWidth + 'px');
  log('视口高 innerHeight', window.innerHeight + 'px');
  log('物理宽 screen.width', screen.width + 'px');
  log('物理高 screen.height', screen.height + 'px');
  log('可用宽 availWidth', screen.availWidth + 'px');
  log('可用高 availHeight', screen.availHeight + 'px');
  log('像素比 devicePixelRatio', dpr.toFixed(2));
  log('色彩深度 colorDepth', screen.colorDepth + ' bit');
  log('像素深度 pixelDepth', screen.pixelDepth + ' bit');
  log('单色 monochrome:1', mqMonochrome ? '是' : '否');
  log('粗指针 pointer:coarse', mqCoarse ? '是' : '否');
  log('慢刷新 update:slow', mqUpdateSlow ? '是' : '否');
  log('分辨率 1dppx', mqResolution1dppx ? '是' : '否');
  log('综合判断 E-ink', isLikelyEink ? '✅ 极可能是' : '❌ 可能不是', true, true);
  log('屏幕方向', (screen.orientation && screen.orientation.type) || '未知');
  log('平台 platform', navigator.platform || '未知');
  log('User Agent', navigator.userAgent, true);
})();
</script>
</body>
</html>
